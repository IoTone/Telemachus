name: Nightly tour

# Runs the full Playwright feature tour every night and publishes the screenshot
# catalog as a downloadable build artifact. Free on public repos.
# Scheduled runs fire only on the repository's default branch; use the "Run
# workflow" button (workflow_dispatch) to trigger it from any branch that has this
# file.
on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily (off-the-hour: GitHub delays on-the-hour crons)
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

defaults:
  run:
    working-directory: refimpl/racketmaximus

jobs:
  tour:
    name: Feature tour + catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          variant: CS
          distribution: full
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install e2e deps + browser
        working-directory: refimpl/racketmaximus/test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium chromium-headless-shell
      - name: Run tours (deterministic fallback model) + build catalogs
        run: bash test/e2e/run.sh
      - name: Upload catalogs
        uses: actions/upload-artifact@v4
        with:
          name: feature-catalog-${{ github.run_id }}
          # Both tours: the feature walkthrough and the beta onboarding funnel.
          path: |
            refimpl/racketmaximus/test/e2e/catalog/catalog.html
            refimpl/racketmaximus/test/e2e/catalog/beta/catalog.html
          retention-days: 30
          if-no-files-found: error

name: Pages

# The documentation site: the developer e-book (both editions), the integrator's
# guide, the GENERATED reference, the runbooks and the design documents. Built by
# scripts/build-site.sh from what is already committed — the book's PDF and HTML
# are built and committed by docs/book/build.sh inside `nix develop`, so this job
# needs no LaTeX and no Racket, only pandoc.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.ja.md'
      - 'CONTRIBUTING.md'
      - 'scripts/build-site.sh'
      - 'scripts/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time; let a running one finish rather than cancelling it
# half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Build
        run: bash scripts/build-site.sh
      # A relative link that resolves in a checkout must resolve on the site too;
      # mirroring the repository's layout is what makes that true, and this is what
      # proves it stayed true.
      - name: Check every local link resolves
        run: |
          python3 - <<'PY'
          # Parse the markup, do not grep it. A regex for `(href|src)="..."` over
          # the raw bytes also matches prose and CODE SPANS that happen to show an
          # attribute, and that is not hypothetical: `doc_render`'s `engine`
          # description documents `src="repo:<object id>"`, so this gate reported
          # two broken links in the generated tools reference and the site stopped
          # deploying for days over documentation that was correct. A checker that
          # cries wolf is worse than no checker, because the next person to see it
          # red will assume it is wrong again.
          import html.parser, os, sys
          root = 'build/site'
          missing = []

          class Links(html.parser.HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.targets = []
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in ('href', 'src') and value:
                          self.targets.append(value)

          for dirpath, _, files in os.walk(root):
              for f in files:
                  if not f.endswith('.html'): continue
                  p = os.path.join(dirpath, f)
                  parser = Links(p)
                  parser.feed(open(p, encoding='utf-8', errors='replace').read())
                  for target in parser.targets:
                      if target.startswith(('http', '//', '#', 'data:', 'mailto:')): continue
                      t = target.split('#')[0].split('?')[0]
                      if not t: continue
                      if not os.path.exists(os.path.normpath(os.path.join(dirpath, t))):
                          missing.append(f'{p} -> {target}')
          for m in missing: print('MISSING', m)
          print(f'{len(missing)} broken link(s) in {root}')
          sys.exit(1 if missing else 0)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

# Free on public repos with GitHub-hosted standard runners.
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: refimpl/racketmaximus

jobs:
  racket:
    name: Racket tests + server smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          variant: CS
          distribution: full
      - name: Compile
        run: |
          export PLTCOLLECTS="$(pwd)/pkgs:"
          raco make server/main.rkt
      - name: Unit tests
        run: |
          export PLTCOLLECTS="$(pwd)/pkgs:"
          # Glob, not an explicit list — a named list silently skips every new suite.
          # Must be `*-tests.rkt`: a bare `test/*.rkt` would pull in test/mock-*.rkt,
          # which are mock *servers* that block forever.
          raco test test/*-tests.rkt
      # pdftotext (poppler-utils) is a real dependency of the document-indexing
      # workflow — flake.nix pins it for the same reason. Without it the smoke's
      # `index-documents` run ends in `error`, deliberately: a missing extractor
      # is an operator-fixable fault the engine refuses to swallow. The runner
      # image does not ship it, so install it here rather than teach the test to
      # tolerate an environment the product does not.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Server smoke
        run: bash test/server-smoke.sh
      # Multi-tenancy is off by default, so the smoke run above already covers the
      # single-tenant path; this boots a second server WITH the flag and asserts the
      # cross-org isolation properties (and that the surface vanishes when off).
      # Its own ports (8836/8837) so it never races the smoke run's 8835.
      - name: Multi-tenancy demo
        run: bash test/multitenant-demo.sh
      # A pull-model executor end to end: create it, run the reference worker
      # against the scripted mock model, route a chat through it (slice 66).
      - name: Pull executor smoke
        run: bash test/pull-smoke.sh
      # Issue #25: the S3 endpoint was built against real aws-cli requests captured
      # on the wire, and since #19 the credential's secret is SEALED at rest, so
      # SigV4 unwraps it on every signed request. The suite skips silently without
      # the CLI, which is how that path went unexercised — install it here, the way
      # poppler-utils is installed above, rather than let the skip hide a gap.
      - name: Install AWS CLI v2
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version
      - name: S3 endpoint smoke (sealed credential)
        run: bash test/s3-smoke.sh
      # The reference under docs/reference/ is generated from the source of truth
      # (tools, workflows, permissions, the route table, plugins) and COMMITTED;
      # this fails the build when a PR changes the code without regenerating.
      - name: Documentation drift gate
        run: |
          export PLTCOLLECTS="$(pwd)/pkgs:"
          racket cli/telemachus-docs.rkt check
      - name: Localization gate
        run: |
          export PLTCOLLECTS="$(pwd)/pkgs:"
          racket cli/telemachus-localize.rkt check surface/messages.rkt surface/greetings.rkt static/ui-strings.json ../../docs/reference/strings.json --required en

  e2e:
    name: E2E feature tour + catalog
    runs-on: ubuntu-latest
    needs: racket
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          variant: CS
          distribution: full
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install e2e deps + browser
        working-directory: refimpl/racketmaximus/test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium chromium-headless-shell
      # The deploy gate: 52 assertions across the whole console, failing on any
      # 5xx and any uncaught page/console error. Runs BEFORE the tours because a
      # broken app should fail fast, and the tours would only photograph it.
      - name: Validate the demo (the e2e gate)
        run: bash test/e2e/validate.sh
      # The funnel in the browser, in Japanese: the switcher, a shared ?lang= link,
      # and the submit path's localized refusal — under the console's CSP. It was
      # not in CI when the console's strings moved into the catalogs, and the
      # funnel's chrome silently stayed English for a while (slice 68).
      - name: Beta funnel localization (browser)
        run: bash test/e2e/funnel-l10n.sh
      - name: Run tours (deterministic fallback model) + build catalogs
        run: bash test/e2e/run.sh
      - name: Upload catalogs
        uses: actions/upload-artifact@v4
        with:
          name: feature-catalog
          # Both tours: the feature walkthrough and the beta onboarding funnel.
          path: |
            refimpl/racketmaximus/test/e2e/catalog/catalog.html
            refimpl/racketmaximus/test/e2e/catalog/beta/catalog.html
          if-no-files-found: error

name: CI

# Free on public repos with GitHub-hosted standard runners.
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: refimpl/racketmaximus

jobs:
  racket:
    name: Racket tests + server smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          variant: CS
          distribution: full
      - name: Compile
        run: |
          export PLTCOLLECTS="$(pwd)/pkgs:"
          raco make server/main.rkt
      - name: Unit tests
        run: |
          export PLTCOLLECTS="$(pwd)/pkgs:"
          # Glob, not an explicit list — a named list silently skips every new suite.
          # Must be `*-tests.rkt`: a bare `test/*.rkt` would pull in test/mock-*.rkt,
          # which are mock *servers* that block forever.
          raco test test/*-tests.rkt
      - name: Server smoke
        run: bash test/server-smoke.sh
      # Multi-tenancy is off by default, so the smoke run above already covers the
      # single-tenant path; this boots a second server WITH the flag and asserts the
      # cross-org isolation properties (and that the surface vanishes when off).
      # Its own ports (8836/8837) so it never races the smoke run's 8835.
      - name: Multi-tenancy demo
        run: bash test/multitenant-demo.sh
      - name: Localization gate
        run: |
          export PLTCOLLECTS="$(pwd)/pkgs:"
          racket cli/telemachus-localize.rkt check surface/messages.rkt surface/greetings.rkt --required en

  e2e:
    name: E2E feature tour + catalog
    runs-on: ubuntu-latest
    needs: racket
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          variant: CS
          distribution: full
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install e2e deps + browser
        working-directory: refimpl/racketmaximus/test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium chromium-headless-shell
      - name: Run tours (deterministic fallback model) + build catalogs
        run: bash test/e2e/run.sh
      - name: Upload catalogs
        uses: actions/upload-artifact@v4
        with:
          name: feature-catalog
          # Both tours: the feature walkthrough and the beta onboarding funnel.
          path: |
            refimpl/racketmaximus/test/e2e/catalog/catalog.html
            refimpl/racketmaximus/test/e2e/catalog/beta/catalog.html
          if-no-files-found: error

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemachus</title>
<style>
  :root{ --bg:#0f1117; --panel:#171a23; --panel2:#1e2230; --line:#2a2f3d; --fg:#e6e8ee;
         --muted:#9aa3b2; --accent:#7c8cff; --accent2:#5a6cff; --ok:#3ddc97; --bad:#ff6b6b; --warn:#ffcc66; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)} button{font:inherit;cursor:pointer}
  .btn{background:var(--accent2);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
  .btn:hover{background:var(--accent)} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:6px} .btn.bad{background:#3a2030;border:1px solid #5a2a3a;color:#ffb4b4}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
         border-radius:8px;padding:9px 11px;font:inherit;margin:4px 0 10px}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap} .row>*{flex:1;min-width:0}
  .muted{color:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .badge.ok{color:var(--ok);border-color:#204a3a} .badge.op{color:var(--warn);border-color:#4a3a20}
  /* auth */
  .auth{max-width:420px;margin:8vh auto;padding:0 16px}
  .brand{font-weight:800;letter-spacing:-.02em} .brand .dot{color:var(--accent)}
  /* shell */
  header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header.top .sp{flex:1} .chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
  nav.tabs{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
  nav.tabs button{background:transparent;border:0;color:var(--muted);padding:8px 14px;border-radius:8px;font-weight:600}
  nav.tabs button.active{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  main.wrap{padding:18px 20px;max-width:960px}
  .langtog button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px}
  .langtog button.active{color:var(--fg);border-color:var(--accent)}
  .note{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--panel2)}
  .note h4{margin:0 0 4px} table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  .bubble .q{color:var(--muted);font-size:13px} .toast{position:fixed;right:16px;bottom:16px;max-width:340px;padding:12px 14px;border-radius:10px;
         background:#2a1a22;border:1px solid #5a2a3a;color:#ffc9c9;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:.2s}
  .toast.show{opacity:1;transform:none} .toast.ok{background:#12271f;border-color:#204a3a;color:#bff3dd}
  h1,h2,h3{letter-spacing:-.01em} h2{margin:.2em 0 .6em}
  /* ---- Tier-A skinnable beta landing: fully theme-token driven, scoped to .bx ---- */
  .bx{min-height:100vh;background:var(--bx-bg,#0f1117);color:var(--bx-ink,#e6e8ee);font-family:var(--bx-font,ui-sans-serif,system-ui,sans-serif)}
  .bx-wrap{max-width:940px;margin:0 auto;padding:0 20px}
  .bx-head{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
  .bx-logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--bx-ink)}
  .bx-logo-img{height:32px;width:auto;max-width:220px;display:block}
  .bx-nav{display:flex;gap:18px;font-size:14px}
  .bx-nav a{color:var(--bx-muted,#9aa3b2);text-decoration:none}
  .bx-hero{background:var(--bx-hero,transparent);border-radius:calc(var(--bx-radius,10px) + 4px);padding:42px 30px;margin:6px 0 26px}
  .bx-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bx-brand,#5a6cff);font-weight:700;margin-bottom:10px}
  .bx-hero h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.08;margin:0 0 10px;color:var(--bx-ink);font-family:var(--bx-fontd,inherit)}
  .bx-hero p{font-size:1.04rem;color:var(--bx-muted);max-width:52ch;margin:0}
  .bx-main{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:start;padding-bottom:36px}
  @media(max-width:760px){.bx-main{grid-template-columns:1fr}}
  .bx-card{background:var(--bx-surface,#171a23);border:1px solid var(--bx-line,rgba(255,255,255,.10));border-radius:var(--bx-radius,10px);padding:22px}
  .bx-card label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--bx-muted);margin:0 0 4px}
  .bx-card input,.bx-card select,.bx-card textarea{width:100%;background:var(--bx-bg);border:1px solid var(--bx-line,rgba(255,255,255,.14));color:var(--bx-ink);border-radius:calc(var(--bx-radius,10px) - 2px);padding:9px 11px;font:inherit;margin:0 0 12px}
  .bx-cta{width:100%;background:var(--bx-brand,#5a6cff);color:var(--bx-brandink,#fff);border:0;border-radius:calc(var(--bx-radius,10px) - 2px);padding:12px;font-weight:800;font-size:15px;cursor:pointer}
  .bx-cta[disabled]{opacity:.8;cursor:default}
  .bx-details h3{font-size:1.05rem;margin:0 0 4px;color:var(--bx-ink)}
  .bx-details p{color:var(--bx-muted);margin:0 0 16px;font-size:.95rem;white-space:pre-line}
  .bx-foot{border-top:1px solid var(--bx-line,rgba(255,255,255,.08));padding:18px 0;color:var(--bx-muted);font-size:13px;text-align:center;white-space:pre-line}
  .bx-signin a{color:var(--bx-brand)}
  /* editor */
  .bx-ed{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.bx-ed{grid-template-columns:1fr}}
  .bx-ed .fieldrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .bx-ed .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:700}
  .bx-swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bx-swatches input[type=color]{height:34px;padding:2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const S = { token: localStorage.getItem('tmx_token')||null, lang: localStorage.getItem('tmx_lang')||'en', me:null, tab:'chat', model:null, features:{}, newToken:null, home:'login', forceLogin:false, betaChallenge:null, betaSub:'prospects', exp:null };
const L = {
  en:{tagline:'Team AI platform — reference implementation',chat:'Chat',agent:'Agent',notes:'Notes',team:'Team',usage:'Usage',admin:'Admin',
      signin:'Sign in',user:'Username',pass:'Password',code:'2FA code (if enabled)',firstrun:'First run — create the first operator',
      createop:'Create operator',send:'Send',prompt:'Prompt',reply:'Reply',newnote:'New note',title:'Title',body:'Body',
      visibility:'Visibility',create:'Create',share:'Share',del:'Delete',members:'Members',addmember:'Add member',role:'Role',
      setquota:'Set limit',dimension:'Dimension',limit:'Limit',logout:'Sign out',operator:'operator',model:'Model',
      chpw:'Change your password',curpw:'Current password',newpw:'New password',updpw:'Update password',
      tools:'Tools',tool:'Tool',enable:'Enable',disable:'Disable',
      translate:'Translate',sourcetext:'Text to translate',target:'Target language',translation:'Translation',
      glossary:'Glossary',term:'Term',addterm:'Add term',recent:'Recent',useglossary:'Use glossary',
      welcome:'Welcome — finish setting up your account.',setpw:'Set your password',confirmpw:'Confirm password',activate:'Activate account',
      apitokens:'API tokens',createtoken:'Create token',revoke:'Revoke',audit:'Audit log',search:'Search',results:'Results',features:'Features',
      documents:'Documents',newdoc:'New document',content:'Content',
      jobs:'Jobs',submitjob:'Submit a job',submit:'Submit',refresh:'Refresh',cancel:'Cancel',
      testing:'Testing tools',seed:'Load sample data',
      beta:'Beta',requestaccess:'Request access',teamsignin:'Team sign-in',qualify:'Qualify',reject:'Reject'},
  ja:{tagline:'チームAIプラットフォーム — リファレンス実装',chat:'チャット',agent:'エージェント',notes:'ノート',team:'チーム',usage:'使用状況',admin:'管理',
      signin:'サインイン',user:'ユーザー名',pass:'パスワード',code:'2FAコード（有効な場合）',firstrun:'初回起動 — 最初のオペレーターを作成',
      createop:'オペレーターを作成',send:'送信',prompt:'プロンプト',reply:'返信',newnote:'新規ノート',title:'タイトル',body:'本文',
      visibility:'公開範囲',create:'作成',share:'共有',del:'削除',members:'メンバー',addmember:'メンバー追加',role:'ロール',
      setquota:'上限を設定',dimension:'項目',limit:'上限',logout:'サインアウト',operator:'オペレーター',model:'モデル',
      chpw:'パスワードの変更',curpw:'現在のパスワード',newpw:'新しいパスワード',updpw:'パスワードを更新',
      tools:'ツール',tool:'ツール',enable:'有効化',disable:'無効化',
      translate:'翻訳',sourcetext:'翻訳するテキスト',target:'翻訳先の言語',translation:'翻訳',
      glossary:'用語集',term:'用語',addterm:'用語を追加',recent:'最近',useglossary:'用語集を使用',
      welcome:'ようこそ — アカウント設定を完了してください。',setpw:'パスワードを設定',confirmpw:'パスワードの確認',activate:'アカウントを有効化',
      apitokens:'APIトークン',createtoken:'トークンを作成',revoke:'失効',audit:'監査ログ',search:'検索',results:'結果',features:'機能',
      documents:'ドキュメント',newdoc:'新規ドキュメント',content:'内容',
      jobs:'ジョブ',submitjob:'ジョブを送信',submit:'送信',refresh:'更新',cancel:'キャンセル',
      testing:'テストツール',seed:'サンプルデータを読み込む',
      beta:'ベータ',requestaccess:'アクセスを申請',teamsignin:'チームサインイン',qualify:'承認',reject:'却下'}
};
const t = k => (L[S.lang]&&L[S.lang][k]) || L.en[k] || k;
const esc = s => (''+ (s??'')).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, {method='GET', body=null}={}){
  const headers = {'X-Telemachus-Locale': S.lang};
  if (S.token) headers['Authorization'] = 'Bearer '+S.token;
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, {method, headers, body: body?JSON.stringify(body):null});
  let json={}; try{ json = await res.json(); }catch(e){}
  return {ok:res.ok, status:res.status, json};
}
function toast(msg, ok=false){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(ok?' ok':'');
  setTimeout(()=>el.className='toast',2600); }
function setLang(l){ S.lang=l; localStorage.setItem('tmx_lang',l); render(); }
function setTok(tk){ S.token=tk; localStorage.setItem('tmx_token',tk); }
function logout(){ S.token=null; localStorage.removeItem('tmx_token'); S.me=null; S.forceLogin=false; render(); }
const val = id => document.getElementById(id).value.trim();

// ---------- auth ----------
function authView(){
  return `<div class="auth">
    <h1 class="brand">Telemachus<span class="dot">.</span></h1>
    <p class="muted">${t('tagline')}</p>
    <div class="langtog" style="margin:10px 0 18px">${langBtns()}</div>
    <div class="card">
      <h2>${t('signin')}</h2>
      <label>${t('user')}</label><input id="lu" autofocus>
      <label>${t('pass')}</label><input id="lp" type="password">
      <label>${t('code')}</label><input id="lc">
      <button class="btn" style="width:100%" onclick="doLogin()">${t('signin')}</button>
    </div>
    <details class="card" style="margin-top:14px">
      <summary style="cursor:pointer" class="muted">${t('firstrun')}</summary>
      <div style="margin-top:12px">
        <label>${t('user')}</label><input id="bu" value="alice">
        <label>${t('pass')}</label><input id="bp" type="password" value="s3cret">
        <button class="btn ghost" onclick="doBootstrap()">${t('createop')}</button>
      </div>
    </details>
  </div>`;
}
async function doLogin(){
  const body={username:val('lu'),password:val('lp')}; const c=val('lc'); if(c) body.code=c;
  const r=await api('/api/login',{method:'POST',body});
  if(r.ok){ setTok(r.json.token); render(); } else toast(r.json.error||'login failed');
}
async function doBootstrap(){
  const r=await api('/api/bootstrap',{method:'POST',body:{username:val('bu'),password:val('bp')}});
  if(r.ok){ setTok(r.json.token); toast(r.json.message||'created',true); render(); } else toast(r.json.error||'failed');
}

// ---------- shell ----------
function langBtns(){ return ['en','ja'].map(l=>`<button class="${S.lang===l?'active':''}" onclick="setLang('${l}')">${l==='en'?'EN':'日本語'}</button>`).join(''); }
function appShell(){
  const tabs=['chat','agent','translate','search','notes','documents','jobs','team','usage'].filter(x=>S.features[x]!==false);
  if(canManage()) tabs.push('beta'); if(S.me.is_operator) tabs.push('admin');
  return `<header class="top">
      <span class="brand">Telemachus<span class="dot">.</span></span>
      <span class="sp"></span>
      <span class="langtog">${langBtns()}</span>
      <span class="chip">${esc(S.me.user_id.slice(0,8))}… ${S.me.is_operator?`<span class="badge op">${t('operator')}</span>`:''}</span>
      <button class="btn ghost sm" onclick="logout()">${t('logout')}</button>
    </header>
    <nav class="tabs">${tabs.map(x=>`<button data-tab="${x}" class="${S.tab===x?'active':''}" onclick="go('${x}')">${t(x)}</button>`).join('')}</nav>
    <main class="wrap" id="main"></main>`;
}
function go(tab){ S.tab=tab; S.newToken=null;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  renderTab(); }

// ---------- tabs ----------
async function chatView(){
  if(!S.model){ const m=await api('/api/ai/model'); S.model=m.json; }
  const badge = S.model?.configured ? `<span class="badge ok">${esc(S.model.model)}</span>` : `<span class="badge">${esc(S.model?.model||'local')} · simulated</span>`;
  return `<h2>${t('chat')} <span class="muted" style="font-size:14px">${t('model')}: ${badge}</span></h2>
    <div class="card">
      <label>${t('prompt')}</label><textarea id="cp" rows="3">Hello team</textarea>
      <button class="btn" onclick="doChat()">${t('send')}</button>
    </div><div id="chatlog"></div>`;
}
async function doChat(){
  const prompt=val('cp'); const log=document.getElementById('chatlog'); const id='b'+Date.now();
  log.insertAdjacentHTML('afterbegin',
    `<div class="bubble" id="${id}"><div class="q">${esc(prompt)}</div><div class="rep"></div><div class="meta muted" style="font-size:12px;margin-top:6px">…</div></div>`);
  const rep=document.querySelector('#'+id+' .rep'), meta=document.querySelector('#'+id+' .meta');
  const headers={'X-Telemachus-Locale':S.lang,'Content-Type':'application/json'}; if(S.token) headers['Authorization']='Bearer '+S.token;
  let res; try{ res=await fetch('/api/ai/chat/stream',{method:'POST',headers,body:JSON.stringify({prompt})}); }
  catch(e){ toast('network error'); document.getElementById(id).remove(); return; }
  if(!res.ok){ let j={}; try{j=await res.json()}catch(e){} toast((j.error||'error')+(j.dimension?` (${j.dimension})`:'')); document.getElementById(id).remove(); return; }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
  for(;;){ const {value,done}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
      if(!line.startsWith('data:')) continue; let ev={}; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(ev.token){ if(meta.textContent==='…') meta.textContent=''; rep.textContent += ev.token; }
      if(ev.error) toast(ev.error);
      if(ev.done) meta.textContent = `${ev.tokens_used} tokens · ${esc(ev.model)} · remaining ${ev.remaining_tokens}`;
    } }
}

async function agentView(){
  return `<h2>${t('agent')} <span class="muted" style="font-size:14px">— the AI uses tools to act on your platform</span></h2>
    <div class="card"><label>${t('prompt')}</label>
      <textarea id="ap" rows="3">Create a private note titled "Q3 goals" with body "ship v1, hire two, launch". Then list my notes.</textarea>
      <button class="btn" onclick="doAgent()">${t('send')}</button></div><div id="agentlog"></div>`;
}
async function doAgent(){
  const prompt=val('ap'); const log=document.getElementById('agentlog'); const id='g'+Date.now();
  log.insertAdjacentHTML('afterbegin', `<div class="bubble" id="${id}"><div class="q">${esc(prompt)}</div><div class="steps"></div><div class="rep" style="margin-top:6px"></div></div>`);
  const steps=document.querySelector('#'+id+' .steps'), rep=document.querySelector('#'+id+' .rep');
  const headers={'X-Telemachus-Locale':S.lang,'Content-Type':'application/json'}; if(S.token) headers['Authorization']='Bearer '+S.token;
  let res; try{ res=await fetch('/api/agent',{method:'POST',headers,body:JSON.stringify({prompt})}); }
  catch(e){ toast('network error'); document.getElementById(id).remove(); return; }
  if(!res.ok){ let j={}; try{j=await res.json()}catch(e){} toast((j.error||'error')+(j.dimension?` (${j.dimension})`:'')); document.getElementById(id).remove(); return; }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
  for(;;){ const {value,done}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
      if(!line.startsWith('data:')) continue; let ev={}; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(ev.type==='assistant' && ev.text) steps.insertAdjacentHTML('beforeend', `<div class="muted" style="margin:3px 0">💭 ${esc(ev.text)}</div>`);
      if(ev.type==='tool') steps.insertAdjacentHTML('beforeend', `<div style="margin:3px 0">🔧 <b>${esc(ev.name)}</b> <span class="mono muted">${esc(JSON.stringify(ev.args))}</span></div>`);
      if(ev.type==='tool_result') steps.insertAdjacentHTML('beforeend', `<div class="mono" style="margin:0 0 6px 20px;color:var(--ok);white-space:pre-wrap">${esc(ev.result)}</div>`);
      if(ev.type==='done') rep.innerHTML = `<div>${esc(ev.reply)}</div><div class="muted" style="font-size:12px;margin-top:4px">${ev.rounds} rounds</div>`;
      if(ev.error) toast(ev.error);
    } }
}
async function notesView(){
  const r=await api('/api/notes'); const notes=r.ok?r.json.notes:[];
  const mem=await api('/api/members'); const members=mem.ok?mem.json.members:[];
  const opts=members.map(m=>`<option value="${m.user_id}">${esc(m.username)}</option>`).join('');
  const list=notes.map(n=>`<div class="note">
      <h4>${esc(n.title)||'(untitled)'} <span class="badge">${esc(n.visibility)}</span> ${n.owner_user_id===S.me.user_id?'<span class="badge ok">mine</span>':''}</h4>
      <div class="muted">${esc(n.body)}</div>
      <div class="row" style="margin-top:8px">
        <div style="flex:2"><select id="sh_${n.id}">${opts}</select></div>
        <div><button class="btn sm ghost" onclick="doShare('${n.id}')">${t('share')}</button></div>
        <div><button class="btn sm bad" onclick="doDelNote('${n.id}')">${t('del')}</button></div>
      </div></div>`).join('') || `<p class="muted">—</p>`;
  return `<h2>${t('notes')}</h2>
    <div class="card"><h3>${t('newnote')}</h3>
      <label>${t('title')}</label><input id="nt" value="Secret plan">
      <label>${t('body')}</label><input id="nb" value="only for me">
      <label>${t('visibility')}</label><select id="nv"><option>team</option><option>private</option><option>shared</option></select>
      <button class="btn" onclick="doCreateNote()">${t('create')}</button>
    </div>${list}`;
}
async function doCreateNote(){ const r=await api('/api/notes',{method:'POST',body:{title:val('nt'),body:val('nb'),visibility:val('nv')}});
  if(r.ok){ toast('created',true); renderTab(); } else toast(r.json.error||'error'); }
async function doShare(id){ const uid=document.getElementById('sh_'+id).value;
  const r=await api('/api/notes/'+id+'/share',{method:'POST',body:{user_id:uid,permission:'notes:read'}});
  toast(r.ok?'shared':(r.json.error||'error'), r.ok); }
async function doDelNote(id){ const r=await api('/api/notes/'+id,{method:'DELETE'});
  if(r.ok){ toast('deleted',true); renderTab(); } else toast(r.json.error||'error'); }

async function teamView(){
  const r=await api('/api/members'); const members=r.ok?r.json.members:[];
  const rows=members.map(m=>`<tr><td>${esc(m.username)}</td><td><span class="badge">${esc(m.role)}</span></td><td class="mono muted">${esc(m.user_id.slice(0,8))}…</td></tr>`).join('');
  const manage=canManage();

// allowlisted font stacks — no CDN, no external fetch (privacy + deterministic deps)
function fontStack(n){ const m={System:'ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
  Serif:'Georgia,Cambria,"Times New Roman",serif',Mono:'ui-monospace,SFMono-Regular,Menlo,monospace',
  Rounded:'ui-rounded,"SF Pro Rounded",system-ui,sans-serif'}; return m[n]||m.System; }
// asset://<id> → our own origin (never an external URL); data:/http passthrough
function assetUrl(ref){ if(!ref) return ''; return ref.indexOf('asset://')===0 ? '/api/beta/asset/'+ref.slice(8) : ref; }
// theme tokens → inline CSS custom properties; values sanitized to prevent style breakout
function bxSan(v){ return String(v==null?'':v).replace(/[;"{}<>]/g,''); }
function bxVars(cfg){ const th=(cfg&&cfg.theme)||{}; const mode=th.mode||'dark';
  const line=th.line||(mode==='light'?'rgba(0,0,0,.12)':'rgba(255,255,255,.10)');
  const hero=th.heroImage
    ? `linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url(${assetUrl(th.heroImage)}) center/cover`
    : (th.heroBg||'transparent');
  const font=th.fontFile ? 'bxcustom,'+fontStack(th.fontBody) : fontStack(th.fontBody);
  const pairs=[['--bx-bg',th.bg||'#0f1117'],['--bx-surface',th.surface||'#171a23'],['--bx-ink',th.ink||'#e6e8ee'],
    ['--bx-muted',th.muted||'#9aa3b2'],['--bx-brand',th.brand||'#5a6cff'],['--bx-brandink',th.brandInk||'#ffffff'],
    ['--bx-radius',th.radius||'12px'],['--bx-hero',hero],['--bx-line',line],
    ['--bx-font',font],['--bx-fontd',th.fontFile?'bxcustom,'+fontStack(th.fontDisplay||th.fontBody):fontStack(th.fontDisplay||th.fontBody)]];
  return pairs.map(([k,v])=>k+':'+bxSan(v)).join(';'); }
// one field input (scoped ids bf_<key>); shared by the live page and the editor preview
function bxField(f){ const id='bf_'+f.key; const req=f.required?' *':'';
  if(f.type==='textarea') return `<label>${esc(f.label)}${req}</label><textarea id="${id}" rows="3"></textarea>`;
  if(f.type==='select') return `<label>${esc(f.label)}${req}</label><select id="${id}"><option value=""></option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  const itype=f.type==='email'?'email':(f.type==='tel'?'tel':'text');
  return `<label>${esc(f.label)}${req}</label><input id="${id}" type="${itype}"${f.type==='tel'?' inputmode="tel" autocomplete="tel"':''}>`; }

// FNV-1a 32-bit — byte-for-byte identical to domain/beta/antispam.rkt powhash (ASCII).
function powhash(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h=(h^s.charCodeAt(i))>>>0; h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function solvePow(nonce,difficulty){ const mask=(difficulty>=32)?0xFFFFFFFF:(((1<<difficulty)>>>0)-1); for(let n=0;;n++){ if((powhash(nonce+':'+n)&mask)===0) return n; } }
async function doBetaSignup(){
  const msg=document.getElementById('betamsg'); msg.innerHTML='<span class="muted">Verifying you’re human…</span>';
  const cfgR=await api('/api/beta/config'); const fields=cfgR.ok?cfgR.json.fields:[];
  if(!S.betaChallenge){ const chR=await api('/api/beta/challenge'); S.betaChallenge=chR.ok?chR.json:null; }
  if(!S.betaChallenge){ msg.innerHTML='<span class="badge">could not start — reload</span>'; return; }
  const {challenge,difficulty,honeypot}=S.betaChallenge;
  const pow=solvePow(challenge.split('.')[0], difficulty);      // proof of work (CPU cost per signup)
  const body={}; for(const f of fields){ const el=document.getElementById('bf_'+f.key); if(el) body[f.key]=el.value; }
  const hp=document.getElementById('bf__hp'); body[honeypot||'_hp']=hp?hp.value:'';
  body.challenge=challenge; body.pow=pow;
  const res=await api('/api/beta/signup',{method:'POST',body});
  if(res.ok){ document.getElementById('betaform').style.display='none'; msg.innerHTML='<b>Thanks — your request is in review.</b><br><span class="muted">We’ll be in touch.</span>'; }
  else { S.betaChallenge=null; msg.innerHTML=`<span class="badge">${esc(res.json.error||'error')}</span>`; }   // drop the used/stale challenge
}

  const docs=r.ok?r.json.documents:[]; const next=r.ok?r.json.next_offset:null;
  const rows=docs.map(d=>`<tr><td>${esc(d.title||'—')}</td><td><span class="badge">${esc(d.visibility)}</span></td><td class="muted">${esc((d.content||'').slice(0,60))}</td><td><button class="btn sm ghost" onclick="doDelDoc('${esc(d.id)}')">${t('del')}</button></td></tr>`).join('');
  return `<h2>${t('documents')}</h2>
    <div class="card"><h3>${t('newdoc')}</h3>
      <label>${t('title')}</label><input id="dt">
      <label>${t('content')}</label><textarea id="dc" rows="4"></textarea>
      <label>${t('visibility')}</label><select id="dv"><option>team</option><option>private</option></select>
      <button class="btn" onclick="doCreateDoc()">${t('create')}</button></div>
    <div class="card" style="margin-top:14px"><table><thead><tr><th>${t('title')}</th><th>${t('visibility')}</th><th>${t('content')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="row" style="margin-top:8px">${off>0?`<button class="btn sm ghost" onclick="doMoreDocs(0)">« first</button>`:''}${(typeof next==='number')?`<button class="btn sm ghost" onclick="doMoreDocs(${next})">more »</button>`:''}</div></div>`;
}
async function doCreateDoc(){ const r=await api('/api/documents',{method:'POST',body:{title:val('dt'),content:val('dc'),visibility:val('dv')}});
  if(r.ok){ S.docOffset=0; toast('created',true); renderTab(); } else toast(r.json.error||'error'); }
async function doDelDoc(id){ const r=await api('/api/documents/'+id,{method:'DELETE'});
  if(r.ok){ toast('deleted',true); renderTab(); } else toast(r.json.error||'error'); }
function doMoreDocs(off){ S.docOffset=off; renderTab(); }
function jobStatusBadge(s){ return s==='done'?'<span class="badge ok">done</span>':`<span class="badge">${esc(s)}</span>`; }
function jobResultText(j){
  if(j.status==='error') return j.error||'';
  const r=j.result; if(!r||r==='null') return '';
  if(typeof r==='object') return (r.reply||r.result||JSON.stringify(r)).toString().slice(0,70);
  return (''+r).slice(0,70);
}
async function jobsView(){
  const r=await api('/api/jobs'); const jobs=r.ok?r.json.jobs:[];
  const rows=jobs.map(j=>`<tr><td class="mono muted">${esc(j.id.slice(0,8))}</td><td>${esc(j.kind)}</td><td>${jobStatusBadge(j.status)}</td><td class="muted">${esc(jobResultText(j))}</td><td>${j.status==='queued'?`<button class="btn sm ghost" onclick="doCancelJob('${esc(j.id)}')">${t('cancel')}</button>`:''}</td></tr>`).join('');
  return `<h2>${t('jobs')}</h2>
    <div class="card"><h3>${t('submitjob')}</h3>
      <div class="row" style="align-items:end">
        <div><label>kind</label><select id="jk"><option value="chat">chat</option><option value="translate">translate</option></select></div>
        <div style="flex:1"><label>${t('prompt')} / ${t('sourcetext')}</label><input id="jtext"></div>
        <div><label>${t('target')}</label><input id="jtgt" value="ja" style="width:90px"></div>
        <div><button class="btn" onclick="doSubmitJob()">${t('submit')}</button></div></div></div>
    <div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${t('jobs')}</h3><button class="btn sm ghost" onclick="renderTab()">${t('refresh')}</button></div>
      <table style="margin-top:8px"><thead><tr><th>id</th><th>kind</th><th>status</th><th>result</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function doSubmitJob(){
  const kind=val('jk'), text=val('jtext');
  const payload = kind==='translate' ? {text, target_lang: val('jtgt')} : {prompt: text};
  const r=await api('/api/jobs',{method:'POST',body:{kind,payload}});
  if(r.ok){ toast('queued',true); renderTab(); } else toast(r.json.error||'error');
}
async function doCancelJob(id){
  const r=await api('/api/jobs/'+id+'/cancel',{method:'POST'});
  if(r.ok){ toast('canceled',true); renderTab(); } else toast(r.json.error||'error');
}
async function betaView(){
  const r=await api('/api/beta/prospects'); const ps=r.ok?r.json.prospects:[];
  const cfg=await api('/api/beta/config'); const fields=cfg.ok?(cfg.json.fields||[]):[];   // details rendered generically from the experience's field defs
  const blocked=r.ok?(r.json.blocked||{}):{}; const bt=Object.values(blocked).reduce((a,b)=>a+(b||0),0);
  const bcard = bt>0 ? `<div class="card" style="margin-bottom:12px"><b>🛡️ Blocked ${bt} abusive attempt(s)</b> <span class="muted" style="font-size:12px">${Object.entries(blocked).map(([k,v])=>esc(k)+': '+v).join(' · ')}</span></div>` : '';
  const verdict=j=>{
    if(!j||j==='null'||typeof j!=='object') return '<span class="muted">judging…</span>';
    return `<span class="badge ${j.valid?'ok':''}">${j.valid?'valid':'flagged'}</span> ${j.score??'?'}/100 · ${esc(j.revenue_estimate||'')}<div class="muted" style="font-size:12px">${esc(j.reasoning||'')}</div>`;
  };
  // value of a field, whether it's a typed column or lives in the attributes blob
  const pval=(p,k)=>{ const v=p[k]; if(v!==undefined&&v!==null&&v!=='') return v; const a=p.attributes||{}; return (a&&a[k])||''; };
  const details=p=>fields.filter(f=>f.key!=='name'&&f.key!=='email'&&pval(p,f.key))
    .map(f=>`<div class="muted" style="font-size:12px"><span style="opacity:.7">${esc(f.label)}:</span> ${esc(pval(p,f.key))}</div>`).join('')||'<span class="muted">—</span>';
  const rows=ps.map(p=>`<tr>
      <td>${esc(p.name)}<div class="muted" style="font-size:12px">${esc(p.email)}</div></td>
      <td>${details(p)}</td>
      <td>${verdict(p.judge)}</td>
      <td><span class="badge">${esc(p.status)}</span></td>
      <td>${(p.status==='qualified'||p.status==='rejected')?'':`<button class="btn sm" onclick="doDecide('${esc(p.id)}','qualified')">${t('qualify')}</button> <button class="btn sm ghost" onclick="doDecide('${esc(p.id)}','rejected')">${t('reject')}</button>`}</td>
    </tr>`).join('');
  return `<h2>${t('beta')} — prospects</h2>${bcard}
    <div class="card"><table><thead><tr><th>prospect</th><th>details</th><th>LLM judge</th><th>status</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="muted">No signups yet.</td></tr>'}</tbody></table></div>`;
}
async function doDecide(id,decision){
  const r=await api('/api/beta/prospects/'+id+'/decide',{method:'POST',body:{decision}});
  if(r.ok){ toast(decision,true); renderTab(); } else toast(r.json.error||'error');
}
// ---- Beta tab: prospects | onboarding-page editor ----
async function betaTabView(){
  const seg=`<div style="display:flex;gap:8px;margin-bottom:14px">
     <button class="btn sm ${S.betaSub==='editor'?'ghost':''}" onclick="betaSub('prospects')">Prospects</button>
     <button class="btn sm ${S.betaSub==='editor'?'':'ghost'}" onclick="betaSub('editor')">Onboarding page</button></div>`;
  return seg + (S.betaSub==='editor' ? await betaEditorView() : await betaView());
}
function betaSub(s){ S.betaSub=s; renderTab(); }
async function betaEditorView(){
  const r=await api('/api/beta/experience'); S.exp = r.ok ? r.json : {};
  return `<div class="bx-ed">
    <div id="bx-controls">${betaControls()}</div>
    <div><div class="muted" style="margin-bottom:8px">Live preview — this is exactly what applicants see</div>
      <div id="bx-preview" style="border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:70vh;overflow-y:auto">${renderLandingShell(S.exp,'preview')}</div>
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
        <button class="btn" onclick="bxSaveDraft()">Save draft</button>
        <button class="btn ghost" onclick="bxPublish()">Publish</button>
        <span id="bxmsg" class="muted" style="font-size:13px"></span></div>
    </div></div>`;
}
// working-copy helpers: mutate S.exp, refresh preview (and controls on structural change)
function bxSet(path,val){ const ks=path.split('.'); let o=S.exp; for(let i=0;i<ks.length-1;i++){ o[ks[i]]=o[ks[i]]||{}; o=o[ks[i]]; } o[ks[ks.length-1]]=val; bxPreview(); }
function bxPreview(){ const el=document.getElementById('bx-preview'); if(el) el.innerHTML=renderLandingShell(S.exp,'preview'); }
function bxRerender(){ const c=document.getElementById('bx-controls'); if(c) c.innerHTML=betaControls(); bxPreview(); }
// upload a brand asset (logo/hero/font) → asset://<id> stored at `target` path
async function bxUpload(input,target){ const f=input.files&&input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async()=>{ const r=await api('/api/beta/assets',{method:'POST',body:{mime:f.type||'application/octet-stream',filename:f.name,data:rd.result}});
    if(r.ok){ bxSet(target,r.json.ref); toast('uploaded',true); bxRerender(); } else toast((r.json&&r.json.error)||'upload failed'); };
  rd.readAsDataURL(f); }
function bxGet(path){ return path.split('.').reduce((o,k)=>o&&o[k],S.exp); }
function bxClear(target){ bxSet(target,''); bxRerender(); }
function bxAsset(label,target,accept){ const has=bxGet(target);
  return `<label>${label}</label><input type="file" accept="${accept}" onchange="bxUpload(this,'${target}')">${has?`<div class="muted" style="margin:-6px 0 12px;font-size:12px">uploaded ✓ &nbsp;<a href="#" onclick="bxClear('${target}');return false">remove</a></div>`:''}`; }
function bxAddDetail(){ (S.exp.details=S.exp.details||[]).push({heading:'',body:''}); bxRerender(); }
function bxDelDetail(i){ S.exp.details.splice(i,1); bxRerender(); }
function bxAddField(){ const fs=(S.exp.fields=S.exp.fields||[]); fs.push({key:'field'+(fs.length+1),label:'New field',type:'text',required:false}); bxRerender(); }
function bxDelField(i){ S.exp.fields.splice(i,1); bxRerender(); }
function bxSetField(i,prop,val){ if(prop==='options') val=val.split(',').map(s=>s.trim()).filter(Boolean); S.exp.fields[i][prop]=val;
  if(prop==='type'||prop==='required') bxRerender(); else bxPreview(); }
function betaControls(){ const e=S.exp||{}; const th=e.theme||{};
  const iv=(p,v)=>`value="${esc(v==null?'':v)}"`;
  const color=(label,path,def)=>`<div><label>${label}</label><input type="color" ${iv(path.split('.').reduce((o,k)=>o&&o[k],e)||def)} oninput="bxSet('${path}',this.value)"></div>`;
  const fieldRow=(f,i)=>`<div class="fieldrow">
      <div class="row"><div><label>Label</label><input ${iv(f.label)} oninput="bxSetField(${i},'label',this.value)"></div>
        <div><label>Key</label><input ${iv(f.key)} oninput="bxSetField(${i},'key',this.value)"></div></div>
      <div class="row"><div><label>Type</label><select onchange="bxSetField(${i},'type',this.value)">${['text','email','tel','textarea','select'].map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div style="flex:0 0 auto"><label>Required</label><input type="checkbox" style="width:auto" ${f.required?'checked':''} onchange="bxSetField(${i},'required',this.checked)"></div></div>
      ${f.type==='select'?`<label>Options (comma-separated)</label><input ${iv((f.options||[]).join(', '))} oninput="bxSetField(${i},'options',this.value)">`:''}
      <button class="btn sm bad" onclick="bxDelField(${i})">Remove field</button></div>`;
  const detailRow=(d,i)=>`<div class="fieldrow"><label>Heading</label><input ${iv(d.heading)} oninput="S.exp.details[${i}].heading=this.value;bxPreview()">
      <label>Body</label><textarea rows="2" oninput="S.exp.details[${i}].body=this.value;bxPreview()">${esc(d.body||'')}</textarea>
      <button class="btn sm bad" onclick="bxDelDetail(${i})">Remove</button></div>`;
  return `<div class="card">
    <div class="sec">Branding</div>
    <label>Logo text</label><input ${iv(e.logo)} oninput="bxSet('logo',this.value)">
    ${bxAsset('Logo image (overrides text)','logoImage','image/*')}
    <label>Eyebrow</label><input ${iv(e.eyebrow)} oninput="bxSet('eyebrow',this.value)">
    <label>Hero title</label><input ${iv(e.title)} oninput="bxSet('title',this.value)">
    <label>Hero subtitle</label><textarea rows="2" oninput="bxSet('subtitle',this.value)">${esc(e.subtitle||'')}</textarea>
    <label>Button label</label><input ${iv(e.cta)} oninput="bxSet('cta',this.value)">
    <label>Footer</label><textarea rows="2" oninput="bxSet('footer',this.value)">${esc(e.footer||'')}</textarea>

    <div class="sec">Theme</div>
    <div class="bx-swatches">
      ${color('Brand','theme.brand','#5a6cff')}${color('Brand text','theme.brandInk','#ffffff')}
      ${color('Background','theme.bg','#0f1117')}${color('Surface','theme.surface','#171a23')}
      ${color('Text','theme.ink','#e6e8ee')}${color('Muted','theme.muted','#9aa3b2')}</div>
    <div class="row" style="margin-top:10px">
      <div><label>Font</label><select onchange="bxSet('theme.fontBody',this.value)">${['System','Serif','Rounded','Mono'].map(f=>`<option ${th.fontBody===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div><label>Corner radius</label><input ${iv(th.radius||'12px')} oninput="bxSet('theme.radius',this.value)"></div></div>
    <label>Hero background (color or CSS gradient)</label><input ${iv(th.heroBg)} oninput="bxSet('theme.heroBg',this.value)">
    ${bxAsset('Hero image (overlaid, overrides background)','theme.heroImage','image/*')}
    ${bxAsset('Custom font (woff2/woff/ttf/otf)','theme.fontFile','.woff2,.woff,.ttf,.otf,font/*')}

    <div class="sec">Detail blocks</div>
    ${(e.details||[]).map(detailRow).join('')}
    <button class="btn sm ghost" onclick="bxAddDetail()">+ Add block</button>

    <div class="sec">Form fields</div>
    ${(e.fields||[]).map(fieldRow).join('')}
    <button class="btn sm ghost" onclick="bxAddField()">+ Add field</button>

    <div class="sec">LLM judge prompt <span class="muted" style="text-transform:none">(never shown to applicants)</span></div>
    <textarea rows="4" oninput="bxSet('judge-system',this.value)">${esc(e['judge-system']||'')}</textarea>
  </div>`;
}
async function bxSaveDraft(){ const m=document.getElementById('bxmsg'); const r=await api('/api/beta/experience',{method:'PUT',body:S.exp});
  if(r.ok){ if(m)m.textContent='Draft saved'; toast('draft saved',true);} else toast(r.json.error||'error'); }
async function bxPublish(){ const m=document.getElementById('bxmsg'); await api('/api/beta/experience',{method:'PUT',body:S.exp});
  const r=await api('/api/beta/experience/publish',{method:'POST'});
  if(r.ok){ if(m)m.textContent='Published — live at the beta URL'; toast('published',true);} else toast(r.json.error||'error'); }
async function searchView(){
  return `<h2>${t('search')}</h2>
    <div class="card">
      <div class="row" style="align-items:end"><div style="flex:1"><label>${t('search')}</label>
        <input id="sq" onkeydown="if(event.key==='Enter')doSearch()" placeholder="notes &amp; translations…"></div>
        <div><button class="btn" onclick="doSearch()">${t('search')}</button></div></div>
      <div id="sres" style="margin-top:12px"></div></div>`;
}
async function doSearch(){
  const q=val('sq'); const el=document.getElementById('sres');
  if(q.length<2){ el.innerHTML='<p class="muted">type at least 2 characters</p>'; return; }
  const r=await api('/api/search?q='+encodeURIComponent(q));
  const res=r.ok?r.json.results:[];
  el.innerHTML = res.length
    ? `<table><thead><tr><th>type</th><th>title</th><th>${t('results')}</th></tr></thead><tbody>`+
      res.map(x=>`<tr><td><span class="badge">${esc(x.type)}</span></td><td>${esc(x.title||'')}</td><td class="muted">${esc(x.snippet||'')}</td></tr>`).join('')+`</tbody></table>`
    : '<p class="muted">no results</p>';
}
async function render(){
  const app=document.getElementById('app');
  const atok=new URLSearchParams(location.search).get('token');
  if(atok && location.pathname.replace(/\/$/,'').endsWith('/activate')){ app.innerHTML=activateView(atok); return; }
  await refreshMe();
  if(!S.me){
    const cfg=await api('/api/config'); S.home = cfg.ok ? cfg.json.home : 'login';
    if(S.home==='beta' && !S.forceLogin){ app.innerHTML=await betaLandingView(); return; }   // root shows the beta funnel
    app.innerHTML=authView(); return;
  }
  const fr=await api('/api/features'); S.features = fr.ok ? Object.fromEntries(fr.json.features.map(x=>[x.feature,x.enabled])) : {};
  if(S.features[S.tab]===false) S.tab='team';
  app.innerHTML=appShell(); renderTab(); }
window.doLogin=doLogin; window.doBootstrap=doBootstrap; window.setLang=setLang; window.logout=logout; window.go=go;
window.doChat=doChat; window.doAgent=doAgent; window.doCreateNote=doCreateNote; window.doShare=doShare; window.doDelNote=doDelNote;
window.doAddMember=doAddMember; window.doSetQuota=doSetQuota; window.doChangePw=doChangePw; window.doToggleTool=doToggleTool;
window.doActivate=doActivate; window.doCreateToken=doCreateToken; window.doRevokeToken=doRevokeToken; window.doSearch=doSearch; window.doToggleFeature=doToggleFeature;
window.doCreateDoc=doCreateDoc; window.doDelDoc=doDelDoc; window.doMoreDocs=doMoreDocs;
window.doSubmitJob=doSubmitJob; window.doCancelJob=doCancelJob; window.doSeedSamples=doSeedSamples;
window.doBetaSignup=doBetaSignup; window.teamSignIn=teamSignIn; window.betaLandingView=betaLandingView; window.doDecide=doDecide;
window.betaSub=betaSub; window.bxSet=bxSet; window.bxSaveDraft=bxSaveDraft; window.bxPublish=bxPublish;
window.bxAddField=bxAddField; window.bxDelField=bxDelField; window.bxSetField=bxSetField;
window.bxAddDetail=bxAddDetail; window.bxDelDetail=bxDelDetail; window.bxUpload=bxUpload; window.bxClear=bxClear; window.S=S;
render();
</script>

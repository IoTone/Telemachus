<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemachus</title>
<style>
  :root{ --bg:#0f1117; --panel:#171a23; --panel2:#1e2230; --line:#2a2f3d; --fg:#e6e8ee;
         --muted:#9aa3b2; --accent:#7c8cff; --accent2:#5a6cff; --ok:#3ddc97; --bad:#ff6b6b; --warn:#ffcc66; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)} button{font:inherit;cursor:pointer}
  .btn{background:var(--accent2);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
  .btn:hover{background:var(--accent)} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:6px} .btn.bad{background:#3a2030;border:1px solid #5a2a3a;color:#ffb4b4}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
         border-radius:8px;padding:9px 11px;font:inherit;margin:4px 0 10px}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap} .row>*{flex:1;min-width:0}
  .muted{color:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .badge.ok{color:var(--ok);border-color:#204a3a} .badge.op{color:var(--warn);border-color:#4a3a20}
  /* auth */
  .auth{max-width:420px;margin:8vh auto;padding:0 16px}
  .brand{font-weight:800;letter-spacing:-.02em} .brand .dot{color:var(--accent)}
  /* shell */
  header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header.top .sp{flex:1} .chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
  nav.tabs{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
  nav.tabs button{background:transparent;border:0;color:var(--muted);padding:8px 14px;border-radius:8px;font-weight:600}
  nav.tabs button.active{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  main.wrap{padding:18px 20px;max-width:960px}
  .langtog button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px}
  .langtog button.active{color:var(--fg);border-color:var(--accent)}
  .note{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--panel2)}
  .note h4{margin:0 0 4px} table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  .bubble .q{color:var(--muted);font-size:13px} .toast{position:fixed;right:16px;bottom:16px;max-width:340px;padding:12px 14px;border-radius:10px;
         background:#2a1a22;border:1px solid #5a2a3a;color:#ffc9c9;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:.2s}
  .toast.show{opacity:1;transform:none} .toast.ok{background:#12271f;border-color:#204a3a;color:#bff3dd}
  h1,h2,h3{letter-spacing:-.01em} h2{margin:.2em 0 .6em}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const S = { token: localStorage.getItem('tmx_token')||null, lang: localStorage.getItem('tmx_lang')||'en', me:null, tab:'chat', model:null };
const L = {
  en:{tagline:'Team AI platform — reference implementation',chat:'Chat',agent:'Agent',notes:'Notes',team:'Team',usage:'Usage',admin:'Admin',
      signin:'Sign in',user:'Username',pass:'Password',code:'2FA code (if enabled)',firstrun:'First run — create the first operator',
      createop:'Create operator',send:'Send',prompt:'Prompt',reply:'Reply',newnote:'New note',title:'Title',body:'Body',
      visibility:'Visibility',create:'Create',share:'Share',del:'Delete',members:'Members',addmember:'Add member',role:'Role',
      setquota:'Set limit',dimension:'Dimension',limit:'Limit',logout:'Sign out',operator:'operator',model:'Model',
      chpw:'Change your password',curpw:'Current password',newpw:'New password',updpw:'Update password',
      tools:'Tools',tool:'Tool',enable:'Enable',disable:'Disable'},
  ja:{tagline:'チームAIプラットフォーム — リファレンス実装',chat:'チャット',agent:'エージェント',notes:'ノート',team:'チーム',usage:'使用状況',admin:'管理',
      signin:'サインイン',user:'ユーザー名',pass:'パスワード',code:'2FAコード（有効な場合）',firstrun:'初回起動 — 最初のオペレーターを作成',
      createop:'オペレーターを作成',send:'送信',prompt:'プロンプト',reply:'返信',newnote:'新規ノート',title:'タイトル',body:'本文',
      visibility:'公開範囲',create:'作成',share:'共有',del:'削除',members:'メンバー',addmember:'メンバー追加',role:'ロール',
      setquota:'上限を設定',dimension:'項目',limit:'上限',logout:'サインアウト',operator:'オペレーター',model:'モデル',
      chpw:'パスワードの変更',curpw:'現在のパスワード',newpw:'新しいパスワード',updpw:'パスワードを更新',
      tools:'ツール',tool:'ツール',enable:'有効化',disable:'無効化'}
};
const t = k => (L[S.lang]&&L[S.lang][k]) || L.en[k] || k;
const esc = s => (''+ (s??'')).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, {method='GET', body=null}={}){
  const headers = {'X-Telemachus-Locale': S.lang};
  if (S.token) headers['Authorization'] = 'Bearer '+S.token;
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, {method, headers, body: body?JSON.stringify(body):null});
  let json={}; try{ json = await res.json(); }catch(e){}
  return {ok:res.ok, status:res.status, json};
}
function toast(msg, ok=false){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(ok?' ok':'');
  setTimeout(()=>el.className='toast',2600); }
function setLang(l){ S.lang=l; localStorage.setItem('tmx_lang',l); render(); }
function setTok(tk){ S.token=tk; localStorage.setItem('tmx_token',tk); }
function logout(){ S.token=null; localStorage.removeItem('tmx_token'); S.me=null; render(); }
const val = id => document.getElementById(id).value.trim();

// ---------- auth ----------
function authView(){
  return `<div class="auth">
    <h1 class="brand">Telemachus<span class="dot">.</span></h1>
    <p class="muted">${t('tagline')}</p>
    <div class="langtog" style="margin:10px 0 18px">${langBtns()}</div>
    <div class="card">
      <h2>${t('signin')}</h2>
      <label>${t('user')}</label><input id="lu" autofocus>
      <label>${t('pass')}</label><input id="lp" type="password">
      <label>${t('code')}</label><input id="lc">
      <button class="btn" style="width:100%" onclick="doLogin()">${t('signin')}</button>
    </div>
    <details class="card" style="margin-top:14px">
      <summary style="cursor:pointer" class="muted">${t('firstrun')}</summary>
      <div style="margin-top:12px">
        <label>${t('user')}</label><input id="bu" value="alice">
        <label>${t('pass')}</label><input id="bp" type="password" value="s3cret">
        <button class="btn ghost" onclick="doBootstrap()">${t('createop')}</button>
      </div>
    </details>
  </div>`;
}
async function doLogin(){
  const body={username:val('lu'),password:val('lp')}; const c=val('lc'); if(c) body.code=c;
  const r=await api('/api/login',{method:'POST',body});
  if(r.ok){ setTok(r.json.token); render(); } else toast(r.json.error||'login failed');
}
async function doBootstrap(){
  const r=await api('/api/bootstrap',{method:'POST',body:{username:val('bu'),password:val('bp')}});
  if(r.ok){ setTok(r.json.token); toast(r.json.message||'created',true); render(); } else toast(r.json.error||'failed');
}

// ---------- shell ----------
function langBtns(){ return ['en','ja'].map(l=>`<button class="${S.lang===l?'active':''}" onclick="setLang('${l}')">${l==='en'?'EN':'日本語'}</button>`).join(''); }
function appShell(){
  const tabs=['chat','agent','notes','team','usage']; if(S.me.is_operator) tabs.push('admin');
  return `<header class="top">
      <span class="brand">Telemachus<span class="dot">.</span></span>
      <span class="sp"></span>
      <span class="langtog">${langBtns()}</span>
      <span class="chip">${esc(S.me.user_id.slice(0,8))}… ${S.me.is_operator?`<span class="badge op">${t('operator')}</span>`:''}</span>
      <button class="btn ghost sm" onclick="logout()">${t('logout')}</button>
    </header>
    <nav class="tabs">${tabs.map(x=>`<button class="${S.tab===x?'active':''}" onclick="go('${x}')">${t(x)}</button>`).join('')}</nav>
    <main class="wrap" id="main"></main>`;
}
function go(tab){ S.tab=tab; renderTab(); }

// ---------- tabs ----------
async function chatView(){
  if(!S.model){ const m=await api('/api/ai/model'); S.model=m.json; }
  const badge = S.model?.configured ? `<span class="badge ok">${esc(S.model.model)}</span>` : `<span class="badge">${esc(S.model?.model||'local')} · simulated</span>`;
  return `<h2>${t('chat')} <span class="muted" style="font-size:14px">${t('model')}: ${badge}</span></h2>
    <div class="card">
      <label>${t('prompt')}</label><textarea id="cp" rows="3">Hello team</textarea>
      <button class="btn" onclick="doChat()">${t('send')}</button>
    </div><div id="chatlog"></div>`;
}
async function doChat(){
  const prompt=val('cp'); const log=document.getElementById('chatlog'); const id='b'+Date.now();
  log.insertAdjacentHTML('afterbegin',
    `<div class="bubble" id="${id}"><div class="q">${esc(prompt)}</div><div class="rep"></div><div class="meta muted" style="font-size:12px;margin-top:6px">…</div></div>`);
  const rep=document.querySelector('#'+id+' .rep'), meta=document.querySelector('#'+id+' .meta');
  const headers={'X-Telemachus-Locale':S.lang,'Content-Type':'application/json'}; if(S.token) headers['Authorization']='Bearer '+S.token;
  let res; try{ res=await fetch('/api/ai/chat/stream',{method:'POST',headers,body:JSON.stringify({prompt})}); }
  catch(e){ toast('network error'); document.getElementById(id).remove(); return; }
  if(!res.ok){ let j={}; try{j=await res.json()}catch(e){} toast((j.error||'error')+(j.dimension?` (${j.dimension})`:'')); document.getElementById(id).remove(); return; }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
  for(;;){ const {value,done}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
      if(!line.startsWith('data:')) continue; let ev={}; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(ev.token){ if(meta.textContent==='…') meta.textContent=''; rep.textContent += ev.token; }
      if(ev.error) toast(ev.error);
      if(ev.done) meta.textContent = `${ev.tokens_used} tokens · ${esc(ev.model)} · remaining ${ev.remaining_tokens}`;
    } }
}

async function agentView(){
  return `<h2>${t('agent')} <span class="muted" style="font-size:14px">— the AI uses tools to act on your platform</span></h2>
    <div class="card"><label>${t('prompt')}</label>
      <textarea id="ap" rows="3">Create a private note titled "Q3 goals" with body "ship v1, hire two, launch". Then list my notes.</textarea>
      <button class="btn" onclick="doAgent()">${t('send')}</button></div><div id="agentlog"></div>`;
}
async function doAgent(){
  const prompt=val('ap'); const log=document.getElementById('agentlog'); const id='g'+Date.now();
  log.insertAdjacentHTML('afterbegin', `<div class="bubble" id="${id}"><div class="q">${esc(prompt)}</div><div class="steps"></div><div class="rep" style="margin-top:6px"></div></div>`);
  const steps=document.querySelector('#'+id+' .steps'), rep=document.querySelector('#'+id+' .rep');
  const headers={'X-Telemachus-Locale':S.lang,'Content-Type':'application/json'}; if(S.token) headers['Authorization']='Bearer '+S.token;
  let res; try{ res=await fetch('/api/agent',{method:'POST',headers,body:JSON.stringify({prompt})}); }
  catch(e){ toast('network error'); document.getElementById(id).remove(); return; }
  if(!res.ok){ let j={}; try{j=await res.json()}catch(e){} toast((j.error||'error')+(j.dimension?` (${j.dimension})`:'')); document.getElementById(id).remove(); return; }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
  for(;;){ const {value,done}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
      if(!line.startsWith('data:')) continue; let ev={}; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(ev.type==='assistant' && ev.text) steps.insertAdjacentHTML('beforeend', `<div class="muted" style="margin:3px 0">💭 ${esc(ev.text)}</div>`);
      if(ev.type==='tool') steps.insertAdjacentHTML('beforeend', `<div style="margin:3px 0">🔧 <b>${esc(ev.name)}</b> <span class="mono muted">${esc(JSON.stringify(ev.args))}</span></div>`);
      if(ev.type==='tool_result') steps.insertAdjacentHTML('beforeend', `<div class="mono" style="margin:0 0 6px 20px;color:var(--ok);white-space:pre-wrap">${esc(ev.result)}</div>`);
      if(ev.type==='done') rep.innerHTML = `<div>${esc(ev.reply)}</div><div class="muted" style="font-size:12px;margin-top:4px">${ev.rounds} rounds</div>`;
      if(ev.error) toast(ev.error);
    } }
}
async function notesView(){
  const r=await api('/api/notes'); const notes=r.ok?r.json.notes:[];
  const mem=await api('/api/members'); const members=mem.ok?mem.json.members:[];
  const opts=members.map(m=>`<option value="${m.user_id}">${esc(m.username)}</option>`).join('');
  const list=notes.map(n=>`<div class="note">
      <h4>${esc(n.title)||'(untitled)'} <span class="badge">${esc(n.visibility)}</span> ${n.owner_user_id===S.me.user_id?'<span class="badge ok">mine</span>':''}</h4>
      <div class="muted">${esc(n.body)}</div>
      <div class="row" style="margin-top:8px">
        <div style="flex:2"><select id="sh_${n.id}">${opts}</select></div>
        <div><button class="btn sm ghost" onclick="doShare('${n.id}')">${t('share')}</button></div>
        <div><button class="btn sm bad" onclick="doDelNote('${n.id}')">${t('del')}</button></div>
      </div></div>`).join('') || `<p class="muted">—</p>`;
  return `<h2>${t('notes')}</h2>
    <div class="card"><h3>${t('newnote')}</h3>
      <label>${t('title')}</label><input id="nt" value="Secret plan">
      <label>${t('body')}</label><input id="nb" value="only for me">
      <label>${t('visibility')}</label><select id="nv"><option>team</option><option>private</option><option>shared</option></select>
      <button class="btn" onclick="doCreateNote()">${t('create')}</button>
    </div>${list}`;
}
async function doCreateNote(){ const r=await api('/api/notes',{method:'POST',body:{title:val('nt'),body:val('nb'),visibility:val('nv')}});
  if(r.ok){ toast('created',true); renderTab(); } else toast(r.json.error||'error'); }
async function doShare(id){ const uid=document.getElementById('sh_'+id).value;
  const r=await api('/api/notes/'+id+'/share',{method:'POST',body:{user_id:uid,permission:'notes:read'}});
  toast(r.ok?'shared':(r.json.error||'error'), r.ok); }
async function doDelNote(id){ const r=await api('/api/notes/'+id,{method:'DELETE'});
  if(r.ok){ toast('deleted',true); renderTab(); } else toast(r.json.error||'error'); }

async function teamView(){
  const r=await api('/api/members'); const members=r.ok?r.json.members:[];
  const rows=members.map(m=>`<tr><td>${esc(m.username)}</td><td><span class="badge">${esc(m.role)}</span></td><td class="mono muted">${esc(m.user_id.slice(0,8))}…</td></tr>`).join('');
  return `<h2>${t('team')}</h2>
    <div class="card"><table><thead><tr><th>${t('user')}</th><th>${t('role')}</th><th>id</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card" style="margin-top:14px"><h3>${t('addmember')}</h3>
      <div class="row"><div><label>${t('user')}</label><input id="mu"></div><div><label>${t('pass')}</label><input id="mp" type="password"></div>
      <div><label>${t('role')}</label><select id="mr"><option>member</option><option>admin</option><option>viewer</option></select></div></div>
      <button class="btn" onclick="doAddMember()">${t('addmember')}</button>
    </div>
    <div class="card" style="margin-top:14px"><h3>${t('chpw')}</h3>
      <label>${t('curpw')}</label><input id="pc" type="password">
      <label>${t('newpw')}</label><input id="pn" type="password">
      <button class="btn" onclick="doChangePw()">${t('updpw')}</button>
    </div>`;
}
async function doChangePw(){
  const r=await api('/api/password',{method:'POST',body:{current_password:val('pc'),new_password:val('pn')}});
  if(r.ok){ toast('password updated',true); document.getElementById('pc').value=''; document.getElementById('pn').value=''; }
  else toast(r.json.error||'error');
}
async function doAddMember(){ const r=await api('/api/members',{method:'POST',body:{username:val('mu'),password:val('mp'),role:val('mr')}});
  if(r.ok){ toast('added',true); renderTab(); } else toast(r.json.error||'error'); }

function canManage(){ if(!S.me) return false; if(S.me.is_operator) return true;
  return (S.me.permissions||[]).some(p=>p==='*:*'||p==='settings:manage'||p==='*:manage'); }
async function usageView(){
  const r=await api('/api/usage'); const q=r.ok?r.json.quota:[];
  const tr=await api('/api/tools'); const tools=tr.ok?tr.json.tools:[];
  const pr=await api('/api/plugins'); const plugins=pr.ok?pr.json.plugins:[];
  const op=await api('/api/oop'); const oops=op.ok?op.json.plugins:[];
  const manage=canManage();
  const rows=q.map(d=>`<tr><td class="mono">${esc(d.dimension)}</td><td>${d.used}</td><td>${d.limit}</td><td>${d.remaining}</td></tr>`).join('');
  const opForm = S.me.is_operator ? `<div class="card" style="margin-top:14px"><h3>${t('setquota')}</h3>
      <div class="row"><div><label>${t('dimension')}</label><select id="qd"><option>ai.tokens.total</option><option>ai.requests</option><option>ai.concurrency</option></select></div>
      <div><label>${t('limit')}</label><input id="ql" value="50"></div></div>
      <button class="btn" onclick="doSetQuota()">${t('setquota')}</button></div>` : '';
  const toolRows=tools.map(x=>`<tr><td class="mono">${esc(x.name)}</td><td class="mono muted">${esc(x.permission)}</td>
      <td>${x.source==='built-in'?'<span class="badge">built-in</span>':`<span class="badge ok">🔌 ${esc(x.source)}</span>`}</td>
      <td>${x.enabled?'<span class="badge ok">on</span>':'<span class="badge">off</span>'}</td>
      <td>${manage?`<button class="btn sm ghost" onclick="doToggleTool('${esc(x.name)}',${!x.enabled})">${x.enabled?t('disable'):t('enable')}</button>`:''}</td></tr>`).join('');
  const plugLine = plugins.length ? `<p class="muted" style="margin:0 0 8px">🔌 ${plugins.map(p=>esc(p.name)+' v'+esc(p.version)).join(', ')}</p>` : '';
  const oopLine = oops.length ? `<p class="muted" style="margin:0 0 8px">🛡️ sandboxed: ${oops.map(p=>esc(p.name)+' <span class="mono">['+(p.scopes||[]).map(esc).join(', ')+']</span>').join(' · ')}</p>` : '';
  return `<h2>${t('usage')}</h2>
    <div class="card"><table><thead><tr><th>${t('dimension')}</th><th>used</th><th>limit</th><th>remaining</th></tr></thead><tbody>${rows}</tbody></table></div>${opForm}
    <div class="card" style="margin-top:14px"><h3>${t('tools')} <span class="muted" style="font-size:13px">— agent capabilities</span></h3>
      ${plugLine}${oopLine}
      <table><thead><tr><th>${t('tool')}</th><th>permission</th><th>source</th><th>status</th><th></th></tr></thead><tbody>${toolRows}</tbody></table></div>`;
}
async function doSetQuota(){ const r=await api('/api/quota',{method:'POST',body:{dimension:val('qd'),limit:parseInt(val('ql'),10),window:'day'}});
  if(r.ok){ toast('updated',true); renderTab(); } else toast(r.json.error||'error'); }
async function doToggleTool(name,enabled){ const r=await api('/api/tools/'+name,{method:'POST',body:{enabled}});
  if(r.ok){ toast(name+(enabled?' enabled':' disabled'),true); renderTab(); } else toast(r.json.error||'error'); }

async function adminView(){
  const r=await api('/api/admin/status');
  const body = r.ok ? `<div class="row"><div class="card"><label>users</label><h2>${r.json.users}</h2></div><div class="card"><label>teams</label><h2>${r.json.teams}</h2></div></div>` : `<p class="badge">${esc(r.json.error||'error')}</p>`;
  return `<h2>${t('admin')}</h2>${body}`;
}

// ---------- render ----------
async function refreshMe(){ if(!S.token){S.me=null;return;} const r=await api('/api/whoami');
  if(r.ok) S.me=r.json; else { S.token=null; localStorage.removeItem('tmx_token'); S.me=null; } }
async function renderTab(){ const el=document.getElementById('main'); el.innerHTML='<p class="muted">…</p>';
  el.innerHTML = await ({chat:chatView,agent:agentView,notes:notesView,team:teamView,usage:usageView,admin:adminView}[S.tab]||chatView)(); }

<style>
  /* The Mentor palette (docs/design/brand/README.md). Grounds are deep/aegean,
     ink is bone. --accent is the brand blue lightened until it is legible on a dark
     ground: it is aegean, not a third hue. --gold is the brand accent and is spent
     on exactly ONE thing in this UI — the wordmark dot. Semantic ok/warn/bad are a
     separate set on purpose; a status colour is not a brand colour. */
  :root{ --bg:#0b1a2b; --panel:#12253a; --panel2:#17304a; --line:#24384f; --fg:#f2ede1;
         --muted:#93a4b8; --accent:#6fa0d1; --accent2:#245e96; --accent3:#2b6ba8;
         --gold:#c9a227; --ok:#8fae52; --bad:#e0725f; --warn:#d9a441; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)} button{font:inherit;cursor:pointer}
  .btn{background:var(--accent2);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
  .btn:hover{background:var(--accent3)} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:6px} .btn.bad{background:#3a2222;border:1px solid #5e332c;color:#f2b8ab}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
         border-radius:8px;padding:9px 11px;font:inherit;margin:4px 0 10px}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap} .row>*{flex:1;min-width:0}
  .muted{color:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .badge.ok{color:var(--ok);border-color:#3a4a24} .badge.op{color:var(--warn);border-color:#4a3a20}
  .badge.bad{color:var(--bad);border-color:#5e332c} .badge.run{color:var(--accent);border-color:#2c4a6b}
  /* workflow step tree: a map fan-out's children are indented under their parent row */
  tr.wfkid td:first-child{padding-left:26px;position:relative}
  tr.wfkid td:first-child::before{content:'└';position:absolute;left:10px;color:var(--muted)}
  pre.wfjson{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;
    margin:6px 0 0;overflow:auto;max-height:260px;font-size:12px;white-space:pre-wrap;word-break:break-word}
  /* auth */
  .auth{max-width:420px;margin:8vh auto;padding:0 16px}
  .brand{font-weight:800;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:.42em}
  .brand .dot{color:var(--gold)}
  /* Brand rule: the mark is aegean, or a knockout. The console ground is dark, so
     it is a knockout — it inherits the wordmark's colour rather than borrowing the
     UI accent, which would put a third blue on the page. */
  .tmx-mark{display:block;flex:none;color:inherit}
  .tmx-logo{display:block;flex:none;width:auto;max-width:260px;object-fit:contain}
  .auth .brand{justify-content:center;margin-bottom:.1em}
  /* shell */
  header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header.top .sp{flex:1} .chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
  nav.tabs{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
  nav.tabs button{background:transparent;border:0;color:var(--muted);padding:8px 14px;border-radius:8px;font-weight:600}
  nav.tabs button.active{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  main.wrap{padding:18px 20px;max-width:960px}
  .langtog button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px}
  .langtog button.active{color:var(--fg);border-color:var(--accent)}
  .note{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--panel2)}
  .note h4{margin:0 0 4px} table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  .bubble .q{color:var(--muted);font-size:13px} .toast{position:fixed;right:16px;bottom:16px;max-width:340px;padding:12px 14px;border-radius:10px;
         background:#2e1c18;border:1px solid #5e332c;color:#f2c9bf;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:.2s}
  .toast.show{opacity:1;transform:none} .toast.ok{background:#1a2415;border-color:#3a4a24;color:#d3e6ae}
  h1,h2,h3{letter-spacing:-.01em} h2{margin:.2em 0 .6em}
  /* ---- Tier-A skinnable beta landing: fully theme-token driven, scoped to .bx ---- */
  .bx{min-height:100vh;background:var(--bx-bg,#0b1a2b);color:var(--bx-ink,#f2ede1);font-family:var(--bx-font,ui-sans-serif,system-ui,sans-serif)}
  .bx-wrap{max-width:940px;margin:0 auto;padding:0 20px}
  .bx-head{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
  .bx-logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--bx-ink);
           display:inline-flex;align-items:center;gap:.45em}
  .bx-logo-img{height:32px;width:auto;max-width:220px;display:block}
  .bx-frame{border:0;width:100%;height:100vh;display:block}
  .bx-nav{display:flex;gap:18px;font-size:14px}
  .bx-nav a{color:var(--bx-muted,#93a4b8);text-decoration:none}
  .bx-lang{display:flex;gap:6px;margin-left:18px}
  .bx-lang button{background:none;border:1px solid var(--bx-muted,#93a4b8);color:var(--bx-muted,#93a4b8);
    border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;line-height:1.6}
  .bx-lang button.active{background:var(--bx-brand,#c9a227);border-color:var(--bx-brand,#c9a227);
    color:var(--bx-brandInk,#132c46);font-weight:600}
  .bx-lang button:focus-visible{outline:2px solid var(--bx-brand,#c9a227);outline-offset:2px}
  .bx-hero{background:var(--bx-hero,transparent);border-radius:calc(var(--bx-radius,10px) + 4px);padding:42px 30px;margin:6px 0 26px}
  .bx-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bx-brand,#c9a227);font-weight:700;margin-bottom:10px}
  .bx-hero h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.08;margin:0 0 10px;color:var(--bx-ink);font-family:var(--bx-fontd,inherit)}
  .bx-hero p{font-size:1.04rem;color:var(--bx-muted);max-width:52ch;margin:0}
  .bx-main{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:start;padding-bottom:36px}
  @media(max-width:760px){.bx-main{grid-template-columns:1fr}}
  .bx-card{background:var(--bx-surface,#12253a);border:1px solid var(--bx-line,rgba(255,255,255,.10));border-radius:var(--bx-radius,10px);padding:22px}
  .bx-card label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--bx-muted);margin:0 0 4px}
  .bx-card input,.bx-card select,.bx-card textarea{width:100%;background:var(--bx-bg);border:1px solid var(--bx-line,rgba(255,255,255,.14));color:var(--bx-ink);border-radius:calc(var(--bx-radius,10px) - 2px);padding:9px 11px;font:inherit;margin:0 0 12px}
  .bx-cta{width:100%;background:var(--bx-brand,#c9a227);color:var(--bx-brandink,#132c46);border:0;border-radius:calc(var(--bx-radius,10px) - 2px);padding:12px;font-weight:800;font-size:15px;cursor:pointer}
  .bx-cta[disabled]{opacity:.8;cursor:default}
  .bx-details h3{font-size:1.05rem;margin:0 0 4px;color:var(--bx-ink)}
  .bx-details p{color:var(--bx-muted);margin:0 0 16px;font-size:.95rem;white-space:pre-line}
  .bx-foot{border-top:1px solid var(--bx-line,rgba(255,255,255,.08));padding:18px 0;color:var(--bx-muted);font-size:13px;text-align:center;white-space:pre-line}
  /* NOT --bx-brand: brand exists to make the CTA pop and an author may legitimately set it to
     anything (incl. a value that vanishes against bg). ink/muted are the tokens an author must
     keep legible on bg, so the way in can't be themed into invisibility. Underlined so it reads
     as a link without depending on hue at all. */
  .bx-signin a{color:var(--bx-muted);text-decoration:underline;text-underline-offset:2px}
  .bx-signin a:hover,.bx-signin a:focus-visible{color:var(--bx-ink)}
  /* editor */
  .bx-warn{border:1px solid #b45309;background:rgba(180,83,9,.12);border-radius:8px;padding:9px 11px;margin:10px 0 0;font-size:13px}
  .bx-warn b{font-weight:700}
  .bx-ed{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.bx-ed{grid-template-columns:1fr}}
  .bx-ed .fieldrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .bx-ed .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:700}
  .bx-swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bx-swatches input[type=color]{height:34px;padding:2px}
</style>

// The Mentor mark (docs/design/brand/) — a helm whose two diamond eyes are an
// owl's and whose nasal guard is the stem of a T. The eyes CROSS the guard, so
// the three holes are one continuous void: two diamonds threaded on a line.
// Three size-specific drawings, not one scaled — going small the diamonds open
// up and the guard widens, or the face silts shut. The gold brow bar that
// completes the T needs a second colour, so it lives only in the asset files;
// here the mark is one path inheriting currentColor.
//
// fill-rule is NONZERO with every hole wound counter-clockwise. It matters:
// under evenodd two overlapping holes CANCEL, so every eye/guard crossing would
// fill back in and weld the face shut.
const MARK_SIL = 'M13 53 V31 a19 19 0 0 1 38 0 V53 Z';
const MARK_D = {
  16: 'M18.5 34 L26 41.5 L33.5 34 L26 26.5 Z M30.5 34 L38 41.5 L45.5 34 L38 26.5 Z M28.5 30 v23 h7 V30 Z',
  32: 'M20 34 L26.5 40.5 L33 34 L26.5 27.5 Z M31 34 L37.5 40.5 L44 34 L37.5 27.5 Z M29 26 v27 h6 V26 Z',
  64: 'M20.5 34 L26.5 40 L32.5 34 L26.5 28 Z M31.5 34 L37.5 40 L43.5 34 L37.5 28 Z M29.5 26 v27 h5 V26 Z'
};
function markSVG(px){
  const d = MARK_D[px <= 20 ? 16 : px <= 40 ? 32 : 64];
  return `<svg class="tmx-mark" viewBox="0 0 64 64" width="${px}" height="${px}" aria-hidden="true" focusable="false">
    <path d="${MARK_SIL} ${d}" fill="currentColor" fill-rule="nonzero"/></svg>`;
}

// The instance localization policy. Public, and fetched on EVERY render pass —
// including for a signed-in user, who otherwise would never see an operator turn
// the switcher off. Applying it is what settles S.lang: a stored per-browser
// preference only wins while the operator allows switching AND still ships that
// catalog. Otherwise the instance default is the answer, which is the whole point
// of the setting — a Japanese instance greets a first-time visitor in Japanese.
async function loadI18n(){
  const r = await api('/api/config');
  if(r.ok && r.json){
    if(r.json.localization) S.i18n = Object.assign(S.i18n, r.json.localization);
    S.home = r.json.home || S.home;

  }

}
// The lockup: an uploaded logo REPLACES the mark and the wordmark both — an
// operator who supplies their own logo is not asking for ours beside it. The
// trailing dot is ours, so it goes with the mark.
function brandLockup(px){
  if(S.brand.logoUrl)
    return `<img class="tmx-logo" src="${esc(S.brand.logoUrl)}" alt="${esc(S.brand.title)}" style="height:${Math.round(px*1.15)}px">`;
  return `${markSVG(px)}<span>${esc(S.brand.title)}<span class="dot">.</span></span>`;
}

// The server is the authority; this only decides what to SHOW. A surface the
// caller cannot use is worse than a missing one — it offers work that will 403.
function canPerm(perm){
  const ps = (S.me && S.me.permissions) || [];
  if (ps.includes('*:*') || ps.includes(perm)) return true;
  const [area] = perm.split(':');
  return ps.includes(area + ':*');
}

async function api(path, {method='GET', body=null}={}){
  const headers = {'X-Telemachus-Locale': S.lang};
  if (S.token) headers['Authorization'] = 'Bearer '+S.token;
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, {method, headers, body: body?JSON.stringify(body):null});
  let json={}; try{ json = await res.json(); }catch(e){}
  return {ok:res.ok, status:res.status, json};
}

async function doChat(){
  const prompt=val('cp'); const log=document.getElementById('chatlog'); const id='b'+Date.now();
  log.insertAdjacentHTML('afterbegin',
    `<div class="bubble" id="${id}"><div class="q">${esc(prompt)}</div><div class="rep"></div><div class="meta muted" style="font-size:12px;margin-top:6px">…</div></div>`);
  const rep=document.querySelector('#'+id+' .rep'), meta=document.querySelector('#'+id+' .meta');
  const headers={'X-Telemachus-Locale':S.lang,'Content-Type':'application/json'}; if(S.token) headers['Authorization']='Bearer '+S.token;
  let res; try{ res=await fetch('/api/ai/chat/stream',{method:'POST',headers,body:JSON.stringify({prompt})}); }
  catch(e){ toast('network error'); document.getElementById(id).remove(); return; }
  if(!res.ok){ let j={}; try{j=await res.json()}catch(e){} toast((j.error||'error')+(j.dimension?` (${j.dimension})`:'')); document.getElementById(id).remove(); return; }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
  for(;;){ const {value,done}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
      if(!line.startsWith('data:')) continue; let ev={}; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(ev.token){ if(meta.textContent==='…') meta.textContent=''; rep.textContent += ev.token; }
      if(ev.error) toast(ev.error);
      if(ev.done) meta.textContent = `${ev.tokens_used} tokens · ${esc(ev.model)} · remaining ${ev.remaining_tokens}`;
    } }
}

async function doAgent(){
  const prompt=val('ap'); const log=document.getElementById('agentlog'); const id='g'+Date.now();
  log.insertAdjacentHTML('afterbegin', `<div class="bubble" id="${id}"><div class="q">${esc(prompt)}</div><div class="steps"></div><div class="rep" style="margin-top:6px"></div></div>`);
  const steps=document.querySelector('#'+id+' .steps'), rep=document.querySelector('#'+id+' .rep');
  const headers={'X-Telemachus-Locale':S.lang,'Content-Type':'application/json'}; if(S.token) headers['Authorization']='Bearer '+S.token;
  let res; try{ res=await fetch('/api/agent',{method:'POST',headers,body:JSON.stringify({prompt})}); }
  catch(e){ toast('network error'); document.getElementById(id).remove(); return; }
  if(!res.ok){ let j={}; try{j=await res.json()}catch(e){} toast((j.error||'error')+(j.dimension?` (${j.dimension})`:'')); document.getElementById(id).remove(); return; }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
  for(;;){ const {value,done}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
      if(!line.startsWith('data:')) continue; let ev={}; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(ev.type==='assistant' && ev.text) steps.insertAdjacentHTML('beforeend', `<div class="muted" style="margin:3px 0">💭 ${esc(ev.text)}</div>`);
      if(ev.type==='tool') steps.insertAdjacentHTML('beforeend', `<div style="margin:3px 0">🔧 <b>${esc(ev.name)}</b> <span class="mono muted">${esc(JSON.stringify(ev.args))}</span></div>`);
      if(ev.type==='tool_result') steps.insertAdjacentHTML('beforeend', `<div class="mono" style="margin:0 0 6px 20px;color:var(--ok);white-space:pre-wrap">${esc(ev.result)}</div>`);
      if(ev.type==='done') rep.innerHTML = `<div>${esc(ev.reply)}</div><div class="muted" style="font-size:12px;margin-top:4px">${ev.rounds} rounds</div>`;
      if(ev.error) toast(ev.error);
    } }
}

  const qs = new URLSearchParams({locale:S3.locale, limit:'50', offset:String(S3.offset)});

// renders can be in flight at once and the SLOWER one would win the innerHTML assignment, painting
// a stale tab over the one you just asked for. Stamp each render and drop any result that a newer

let renderSeq = 0;
async function renderTab(){ const el=document.getElementById('main'); const seq = ++renderSeq;

// allowlisted font stacks — no CDN, no external fetch (privacy + deterministic deps)
function fontStack(n){ const m={System:'ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
  Serif:'Georgia,Cambria,"Times New Roman",serif',Mono:'ui-monospace,SFMono-Regular,Menlo,monospace',
  Rounded:'ui-rounded,"SF Pro Rounded",system-ui,sans-serif'}; return m[n]||m.System; }
// asset://<id> → our own origin (never an external URL); data:/http passthrough
function assetUrl(ref){ if(!ref) return ''; return ref.indexOf('asset://')===0 ? '/api/beta/asset/'+ref.slice(8) : ref; }
// theme tokens → inline CSS custom properties; values sanitized to prevent style breakout
function bxSan(v){ return String(v==null?'':v).replace(/[;"{}<>]/g,''); }
function bxVars(cfg){ const th=(cfg&&cfg.theme)||{}; const mode=th.mode||'dark';
  const line=th.line||(mode==='light'?'rgba(0,0,0,.12)':'rgba(255,255,255,.10)');
  const hero=th.heroImage
    ? `linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url(${assetUrl(th.heroImage)}) center/cover`
    : (th.heroBg||'transparent');
  const font=th.fontFile ? 'bxcustom,'+fontStack(th.fontBody) : fontStack(th.fontBody);
  const pairs=[['--bx-bg',th.bg||'#0b1a2b'],['--bx-surface',th.surface||'#12253a'],['--bx-ink',th.ink||'#f2ede1'],
    ['--bx-muted',th.muted||'#93a4b8'],['--bx-brand',th.brand||'#c9a227'],['--bx-brandink',th.brandInk||'#132c46'],
    ['--bx-radius',th.radius||'12px'],['--bx-hero',hero],['--bx-line',line],
    ['--bx-font',font],['--bx-fontd',th.fontFile?'bxcustom,'+fontStack(th.fontDisplay||th.fontBody):fontStack(th.fontDisplay||th.fontBody)]];
  return pairs.map(([k,v])=>k+':'+bxSan(v)).join(';'); }

function bxLangBtns(cfg){
  const av = (cfg && cfg.locales) || [];

// FNV-1a 32-bit — byte-for-byte identical to domain/beta/antispam.rkt powhash (ASCII).
function powhash(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h=(h^s.charCodeAt(i))>>>0; h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function solvePow(nonce,difficulty){ const mask=(difficulty>=32)?0xFFFFFFFF:(((1<<difficulty)>>>0)-1); for(let n=0;;n++){ if((powhash(nonce+':'+n)&mask)===0) return n; } }
async function doBetaSignup(){
  const msg=document.getElementById('betamsg'); msg.innerHTML=`<span class="muted">${esc(t('bxverifying'))}</span>`;

  if(!S.betaChallenge){ const chR=await api('/api/beta/challenge'); S.betaChallenge=chR.ok?chR.json:null; }

  const {challenge,difficulty,honeypot}=S.betaChallenge;

// Binary documents. The upload is a raw PUT of the File itself — no base64, no JSON
// envelope — so a 30 MB PDF costs 30 MB on the wire instead of 40, and neither end
// has to hold a string copy of it. Downloads go through a blob URL because the
// endpoint needs an Authorization header, which a plain <a href> cannot carry.

  return (i===0?v:v.toFixed(1))+' '+u[i];
}

async function repoUpload(){
  const f=document.getElementById('rfile').files[0];
  if(!f) return toast('choose a file first');
  const key=val('rkey')||f.name, vis=val('rvis');
  // Uploading to a path that already exists is a NEW VERSION, not a new document —
  // so the form's visibility select must not travel with it. Sending it would let a
  // re-upload silently re-open a document its owner had made private, which is the
  // one thing "the creator sets the visibility" must never allow by accident.
  const overwrite = (S.repoKeys||[]).indexOf(key) >= 0;
  const prog=document.getElementById('rprog');
  prog.innerHTML=`<p class="muted">${t('uploading')} ${esc(f.name)} (${esc(humanBytes(f.size))})…</p>`;
  const q='?filename='+encodeURIComponent(f.name)
        + (overwrite ? '' : '&visibility='+encodeURIComponent(vis));
  // the raw File goes as the body; the browser sets no Content-Type of its own for a
  // Blob body unless we ask, so the file's own type is passed explicitly
  const res=await fetch('/api/repo/'+key.split('/').map(encodeURIComponent).join('/')+q, {
    method:'PUT',
    headers:{'Authorization':'Bearer '+S.token,
             'Content-Type': f.type||'application/octet-stream'},
    body: f });
  let j={}; try{ j=await res.json(); }catch(e){}
  prog.innerHTML='';
  if(res.ok){ document.getElementById('rfile').value='';
              toast(overwrite ? t('newversion') : t('uploaded'), true); renderTab(); }
  else toast(j.error||('upload failed ('+res.status+')'));
}

// The content endpoint needs a bearer token, so the file is fetched and handed to
// the browser as an object URL rather than linked directly.
async function repoDownload(id, key){
  const res=await fetch('/api/repo-obj/'+encodeURIComponent(id)+'/content',
                        {headers:{'Authorization':'Bearer '+S.token}});
  if(!res.ok) return toast('download failed ('+res.status+')');
  const blob=await res.blob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=(key||'download').split('/').pop();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

// ---------- workflows (slice 48) ----------
// The console is a client of exactly the HTTP contract curl uses: list definitions,
// POST a run, poll the run. It knows nothing about how a step executes — that stays
// in the engine, which is why a plugin-shipped workflow and a JSON-published one
// render identically here.
function wfBadge(s){
  const cls = s==='done'?'ok':(s==='error'?'bad':(s==='running'?'run':''));
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
function wfJson(v,label){
  if(v===null||v===undefined||v==='null') return '';
  const j=JSON.stringify(v,null,2);
  if(j==='{}'||j==='null'||j===undefined) return '';
  return `<details><summary class="muted" style="cursor:pointer;font-size:12px">${esc(label)}</summary><pre class="wfjson">${esc(j)}</pre></details>`;
}
// a step's output is {result: …} — show the result inline, full object one click away
function wfOut(st){
  if(st.status==='error') return `<span style="color:var(--bad)">${esc((st.error||'failed').slice(0,140))}</span>`;
  const o=st.output; if(!o||o==='null'||typeof o!=='object') return '<span class="muted">—</span>';
  if(Array.isArray(o.results))                       // a map parent — its children carry the detail
    return `<span class="muted">${o.results.length} ${t('results').toLowerCase()}</span>${wfJson(o,'json')}`;
  const r=('result' in o)?o.result:o;
  const line=(typeof r==='string'?r:JSON.stringify(r))||'';
  return `<span class="mono" style="font-size:13px">${esc(line.slice(0,140))}${line.length>140?'…':''}</span>${wfJson(o,'json')}`;
}

// The run form is generated from the spec's own `input` map — the same declaration
// `check-input!` enforces server-side, so the form can't drift from what is accepted.
function wfRunForm(){
  const d=S.wfSpec; if(!d) return '';
  const spec=d.spec||{}, inputs=spec.input||{}, keys=S.wfKeys||[];
  const fields=keys.length?keys.map((k,i)=>{
    const ty=inputs[k];
    const lab=`<label>${esc(k)}<span class="muted" style="text-transform:none;letter-spacing:0"> · ${esc(ty)}</span></label>`;
    if(ty==='object'||ty==='array') return `${lab}<textarea id="wfi_${i}" rows="3" placeholder="${ty==='array'?'[]':'{}'}"></textarea>`;
    if(ty==='boolean')              return `${lab}<select id="wfi_${i}"><option value="false">false</option><option value="true">true</option></select>`;
    return `${lab}<input id="wfi_${i}"${ty==='number'?' type="number"':''}>`;
  }).join(''):'<p class="muted">This workflow takes no input.</p>';
  const desc=(d.description&&d.description!=='null')?`<p class="muted" style="margin:0 0 10px">${esc(d.description)}</p>`:'';
  const chain=(spec.steps||[]).map(x=>esc(x.id)).join(' → ');
  return `<div class="card" style="margin-top:14px">
    <h3 style="margin:0 0 4px">${t('runwf')} — ${esc(d.name||d.slug)}</h3>${desc}
    <div class="muted mono" style="font-size:12px;margin-bottom:12px">${esc(d.slug)} v${esc(d.version)} · ${chain}</div>
    ${fields}
    <button class="btn" onclick="wfStart()">${t('runwf')}</button>
    <button class="btn ghost" onclick="wfSelect(null)">${t('cancel')}</button></div>`;
}

async function wfSelect(slug){
  if(!slug){ S.wfSel=null; S.wfSpec=null; S.wfKeys=[]; return renderTab(); }
  const r=await api('/api/workflows/'+encodeURIComponent(slug));
  if(!r.ok) return toast(r.json.error||'error');
  S.wfSel=slug; S.wfSpec=r.json; S.wfKeys=Object.keys((r.json.spec||{}).input||{});
  renderTab();
}
async function wfStart(){
  const d=S.wfSpec; if(!d) return;
  const inputs=(d.spec||{}).input||{}, keys=S.wfKeys||[], body={};
  for(let i=0;i<keys.length;i++){
    const k=keys[i], ty=inputs[k], el=document.getElementById('wfi_'+i); if(!el) continue;
    const raw=el.value.trim(); if(raw==='') continue;
    if(ty==='number'){ const n=Number(raw); if(Number.isNaN(n)) return toast(k+': not a number'); body[k]=n; }
    else if(ty==='boolean'){ body[k]=(raw==='true'); }
    else if(ty==='object'||ty==='array'){ try{ body[k]=JSON.parse(raw); }catch(e){ return toast(k+': invalid JSON'); } }
    else body[k]=raw;
  }
  const r=await api('/api/workflows/'+encodeURIComponent(d.slug)+'/run',{method:'POST',body:{input:body}});
  if(r.ok){ S.wfSel=null; S.wfSpec=null; S.wfRun=r.json.id; toast('started',true); renderTab(); }
  else toast(r.json.error||'error');
}
function wfOpen(id){ S.wfRun=id; S.wfPoll++; renderTab(); }
function wfBack(){ S.wfRun=null; S.wfPoll++; renderTab(); }

  const r=await api('/api/runs/'+encodeURIComponent(id)+'/cancel',{method:'POST'});

async function wfRunView(id){
  const r=await api('/api/runs/'+encodeURIComponent(id));
  if(!r.ok) return `<h2>${t('runs')}</h2><div class="card"><p class="muted">${esc(r.json.error||'not found')}</p>
    <button class="btn ghost" onclick="wfBack()">${t('back')}</button></div>`;
  const run=r.json, steps=run.steps||[];
  const live=(run.status==='queued'||run.status==='running');
  // a step row survives a restart because it IS the state — so polling the run is
  // enough; there is no in-memory progress to miss.
  if(live){ const gen=++S.wfPoll;
    setTimeout(()=>{ if(S.tab==='workflows'&&S.wfRun===id&&S.wfPoll===gen) renderTab(); },1500); }
  const kidsOf=s=>steps.filter(x=>x.parent_id===s.id);         // a map fan-out's children
  const row=(s,kid)=>`<tr${kid?' class="wfkid"':''}>
      <td class="mono">${esc(s.step_id)}</td>
      <td>${wfBadge(s.status)}${s.attempt>1?`<span class="muted" style="font-size:12px"> · try ${esc(s.attempt)}</span>`:''}</td>
      <td>${wfOut(s)}</td></tr>`;
  const rows=steps.filter(s=>!s.parent_id).map(s=>row(s,false)+kidsOf(s).map(k=>row(k,true)).join('')).join('');
  const err=(run.error&&run.error!=='null')
    ? `<div class="card" style="margin-top:14px;border-color:#5e332c"><b style="color:var(--bad)">error</b>
       <div class="mono" style="font-size:13px;margin-top:6px">${esc(run.error)}</div></div>` : '';
  return `<h2>${esc(run.slug||t('runs'))} <span class="muted mono" style="font-size:14px">${esc(run.id.slice(0,8))}…</span></h2>
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div style="flex:none">${wfBadge(run.status)} <span class="muted">${esc(run.steps_used)} ${t('stepsused')}</span>${live?' <span class="muted">· live</span>':''}</div>
        <div style="flex:none">${live?`<button class="btn sm bad" onclick="wfCancel('${esc(run.id)}')">${t('cancel')}</button> `:''}<button class="btn sm ghost" onclick="renderTab()">${t('refresh')}</button> <button class="btn sm ghost" onclick="wfBack()">${t('back')}</button></div>
      </div>
      ${wfJson(run.input,t('input'))}${wfJson(run.output,t('output'))}
    </div>${err}
    <div class="card" style="margin-top:14px"><h3 style="margin:0 0 8px">${t('steps')}</h3>
      <table><thead><tr><th>step</th><th>${t('status')}</th><th>${t('output')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function betaView(){

const BX_STARTER_TEMPLATE = '<style>\n  body{margin:0;font:16px/1.6 ui-sans-serif,system-ui,sans-serif;background:#0b1a2b;color:#f2ede1}\n  .wrap{max-width:560px;margin:0 auto;padding:40px 22px}\n  .eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#c9a227;font-weight:700}\n  h1{font-size:2rem;line-height:1.1;margin:.2em 0 .3em}\n  form{background:#12253a;border:1px solid #24384f;border-radius:12px;padding:22px;margin-top:18px}\n  label{display:block;font-size:12px;text-transform:uppercase;color:#93a4b8;margin:0 0 4px}\n  input,select,textarea{width:100%;box-sizing:border-box;background:#0b1a2b;border:1px solid #24384f;color:#f2ede1;border-radius:8px;padding:10px 12px;font:inherit}\n  p{margin:0 0 12px}\n  button{width:100%;margin-top:6px;background:#c9a227;color:#132c46;border:0;border-radius:8px;padding:12px;font-weight:800;cursor:pointer}\n</style>\n<div class="wrap">\n  <div class="eyebrow">{{eyebrow}}</div>\n  <h1>{{title}}</h1>\n  <p>{{subtitle}}</p>\n  <form>\n    {{fields}}\n    <button data-beta-submit>{{cta}}</button>\n    {{message}}\n  </form>\n</div>';
function bxSetLanding(v){
  if(v==='bundle') S.exp.landing={type:'bundle',plugin:(S.exp.landing&&S.exp.landing.plugin)||'beta-onboarding'};
  else if(v==='template'){ S.exp.landing={type:'template'}; if(!S.exp.template) S.exp.template=BX_STARTER_TEMPLATE; }

  bxRerender(); }
function bxAsset(label,target,accept){ const has=bxGet(target);
  return `<label>${label}</label><input type="file" accept="${accept}" onchange="bxUpload(this,'${target}')">${has?`<div class="muted" style="margin:-6px 0 12px;font-size:12px">uploaded ✓ &nbsp;<a href="#" onclick="bxClear('${target}');return false">remove</a></div>`:''}`; }
function bxAddDetail(){ (S.exp.details=S.exp.details||[]).push({heading:'',body:''}); bxRerender(); }

function bxAddField(){ const fs=(S.exp.fields=S.exp.fields||[]); fs.push({key:'field'+(fs.length+1),label:'New field',type:'text',required:false}); bxRerender(); }
function bxDelField(i){ S.exp.fields.splice(i,1); bxRerender(); }
function bxSetField(i,prop,val){
  if(prop==='options') val=val.split(',').map(s=>s.trim()).filter(Boolean);
  // A number input hands back a STRING. Storing "13" would publish a constraint
  // the server then ignores (it wants an integer) — a silent no-op, which is the
  // worst outcome for a validation rule. Blank removes the key entirely.
  if(prop==='minlength'||prop==='maxlength'){
    const n=parseInt(val,10);
    if(!Number.isInteger(n)||n<=0){ delete S.exp.fields[i][prop]; bxPreview(); return; }
    val=n;
  }
  S.exp.fields[i][prop]=val;
  if(prop==='type'||prop==='required') bxRerender(); else bxPreview(); }
// ---- contrast checking for the theme editor (WCAG 2.x relative luminance) ----
// A brandable public page is easy to theme into illegibility — this catches it while editing
// rather than after publishing. Only flags hex; gradients/CSS functions are skipped, not guessed.
function bxLum(hex){ const h=String(hex||'').trim().replace(/^#/,'');
  const full = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  if(!/^[0-9a-fA-F]{6}$/.test(full)) return null;
  const ch=[0,2,4].map(i=>parseInt(full.slice(i,i+2),16)/255)
    .map(c=> c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4));
  return 0.2126*ch[0]+0.7152*ch[1]+0.0722*ch[2]; }
function bxContrast(a,b){ const la=bxLum(a), lb=bxLum(b); if(la===null||lb===null) return null;
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05); }
function bxContrastWarnings(th){
  th=th||{};
  const bg=th.bg||'#0b1a2b', ink=th.ink||'#f2ede1', muted=th.muted||'#93a4b8';
  const brand=th.brand||'#c9a227', brandInk=th.brandInk||'#132c46';
  // pair, threshold, why it matters — 4.5:1 is the WCAG AA floor for body text, 3:1 for large/UI
  const checks=[
    ['Text on background',      ink,      bg,       4.5],
    ['Muted text on background',muted,    bg,       4.5],
    ['Button label on brand',   brandInk, brand,    4.5],
    ['Brand on background',     brand,    bg,       3.0],
  ];
  const bad=checks.map(([label,fg,bgc,min])=>{ const r=bxContrast(fg,bgc);
      return r===null||r>=min ? null : {label,ratio:r,min}; }).filter(Boolean);
  if(!bad.length) return '';
  return `<div class="bx-warn"><b>Low contrast</b>${bad.map(w=>
    `<div>${esc(w.label)} — <b>${w.ratio.toFixed(2)}:1</b> (needs ${w.min}:1)</div>`).join('')}
    <div class="muted" style="margin-top:6px">Readers may not be able to see this text.</div></div>`; }

  const lt=(e.landing&&e.landing.type)||'shell';

      <option value="bundle" ${isBundle?'selected':''}>Custom plugin bundle — Tier B</option>
    </select>
    ${isBundle?`<label>Plugin name</label><input ${iv(e.landing.plugin)} oninput="bxSet('landing.plugin',this.value)">
      <div class="muted" style="font-size:12px;margin:-6px 0 12px">Served from <span class="mono">/beta/bundle/${esc(e.landing.plugin||'')}/</span>. The controls below still configure the SDK payload (fields, judge); the bundle owns the look.</div>`:''}
    ${isTemplate?`<label>HTML template</label>
      <textarea class="mono" rows="12" style="font-size:12px" oninput="bxSet('template',this.value)">${esc(e.template||'')}</textarea>
      <div class="muted" style="font-size:12px;margin:-6px 0 12px">Placeholders: <span class="mono">{{title}} {{subtitle}} {{eyebrow}} {{logo}} {{cta}} {{footer}} {{fields}} {{message}}</span>. Scripts, event handlers and dangerous tags are stripped on publish; the page renders in a sandboxed iframe and submission is wired for you (a <span class="mono">[data-beta-submit]</span> button).</div>`:''}
    <div class="sec">Branding</div>
    <label>Logo text</label><input ${iv(e.logo)} oninput="bxSet('logo',this.value)">
    ${bxAsset('Logo image (overrides text)','logoImage','image/*')}
    <label>Eyebrow</label><input ${iv(e.eyebrow)} oninput="bxSet('eyebrow',this.value)">
    <label>Hero title</label><input ${iv(e.title)} oninput="bxSet('title',this.value)">
    <label>Hero subtitle</label><textarea rows="2" oninput="bxSet('subtitle',this.value)">${esc(e.subtitle||'')}</textarea>
    <label>Button label</label><input ${iv(e.cta)} oninput="bxSet('cta',this.value)">
    <label>Footer</label><textarea rows="2" oninput="bxSet('footer',this.value)">${esc(e.footer||'')}</textarea>
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0">
      <input type="checkbox" style="width:auto;margin:0" ${e.showSignIn!==false?'checked':''}
             onchange="bxSet('showSignIn',this.checked)">
      Show the team sign-in link on the landing page</label>
    <div class="muted" style="font-size:12px;margin:-6px 0 12px">Your team can always sign in at <code>/login</code>, whether or not this is shown.</div>

    <div class="sec">Theme</div>
    <div class="bx-swatches">
      ${color('Brand','theme.brand','#c9a227')}${color('Brand text','theme.brandInk','#132c46')}
      ${color('Background','theme.bg','#0b1a2b')}${color('Surface','theme.surface','#12253a')}

    ${bxContrastWarnings(th)}
    <div class="row" style="margin-top:10px">
      <div><label>Font</label><select onchange="bxSet('theme.fontBody',this.value)">${['System','Serif','Rounded','Mono'].map(f=>`<option ${th.fontBody===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div><label>Corner radius</label><input ${iv(th.radius||'12px')} oninput="bxSet('theme.radius',this.value)"></div></div>

async function bxSaveDraft(){ const m=document.getElementById('bxmsg'); const r=await api('/api/beta/experience',{method:'PUT',body:S.exp});
  if(r.ok){ if(m)m.textContent='Draft saved'; toast('draft saved',true);} else toast(r.json.error||'error'); }

async function searchView(){

        <input id="sq" onkeydown="if(event.key==='Enter')doSearch()" placeholder="${t('searchph')}"></div>

async function doSearch(){
  const q=val('sq'); const el=document.getElementById('sres');
  if(q.length<2){ el.innerHTML='<p class="muted">type at least 2 characters</p>'; return; }
  const r=await api('/api/search?q='+encodeURIComponent(q));
  const res=r.ok?r.json.results:[];
  el.innerHTML = res.length
    ? `<table><thead><tr><th>type</th><th>title</th><th>${t('results')}</th><th></th></tr></thead><tbody>`+
      res.map(x=>`<tr><td><span class="badge${x.type==='file'?' run':''}">${esc(x.type)}</span></td>
        <td class="${x.type==='file'?'mono':''}">${esc(x.title||'')}</td>
        <td class="muted">${esc(x.snippet||'')}</td>
        <td>${x.type==='file'?`<button class="btn sm ghost" onclick="repoDownload('${esc(x.id)}','${esc(x.title||'')}')">${t('download')}</button>`:''}</td></tr>`).join('')+`</tbody></table>`
    : '<p class="muted">no results</p>';
}
// `render` awaits four times (branding, me, config/features). Anything that
// changes S while one is in flight — logout nulling S.me is the easy one — used
// to let the stale run resume and paint with the new state half-applied, which
// threw "Cannot read properties of null (reading 'is_operator')" out of
// appShell(). A generation counter makes the older run stand down at each await
// boundary, so the newest render always wins and no half-render reaches the DOM.
let shellSeq = 0;
async function render(){
  const seq = ++shellSeq;
  const stale = () => seq !== shellSeq;
  const app=document.getElementById('app');
  const atok=new URLSearchParams(location.search).get('token');
  if(atok && location.pathname.replace(/\/$/,'').endsWith('/activate')){ app.innerHTML=activateView(atok); return; }
  await loadBranding(); if(stale()) return;
  await loadI18n();     if(stale()) return;
  await refreshMe();    if(stale()) return;
  if(!S.me){
    const cfg = S.cfg ? {ok:true, json:S.cfg} : await api('/api/config');   // loadI18n() already fetched it
    if(stale()) return; S.home = cfg.ok ? cfg.json.home : 'login';
    const atLoginPath = location.pathname.replace(/\/$/,'').endsWith('/login');
    const forceLogin = S.forceLogin || atLoginPath || new URLSearchParams(location.search).get('login')==='1';
    if(S.home==='beta' && !forceLogin){
      const l = cfg.ok && cfg.json.landing;
      if(l && l.type==='bundle' && l.url){ location.replace(l.url); return; }   // Tier-B: hand-coded plugin bundle
      if(l && l.type==='template' && l.url){                                    // Tier-C: sandboxed custom HTML template
        app.innerHTML='<iframe class="bx-frame" sandbox="allow-scripts allow-forms allow-top-navigation-by-user-activation" src="'+l.url+'"></iframe>'; return; }
      const bx=await betaLandingView(); if(stale()) return;
      app.innerHTML=bx; return;                                                 // Tier-A: built-in themeable shell
    }
    app.innerHTML=authView(); return;
  }
  const fr=await api('/api/features'); if(stale()) return;
  S.features = fr.ok ? Object.fromEntries(fr.json.features.map(x=>[x.feature,x.enabled])) : {};
  if(S.features[S.tab]===false) S.tab='team';
  if(!S.me) return;                      // signed out while we were awaiting
  app.innerHTML=appShell(); renderTab(); }

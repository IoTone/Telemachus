<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23132c46'/%3E%3Cpath d='M13 53 V31 a19 19 0 0 1 38 0 V53 Z M18.5 34 L26 41.5 L33.5 34 L26 26.5 Z M30.5 34 L38 41.5 L45.5 34 L38 26.5 Z M28.5 30 v23 h7 V30 Z' fill='%23f2ede1' fill-rule='nonzero'/%3E%3C/svg%3E">
<style>
  /* The Mentor palette (docs/design/brand/README.md). Grounds are deep/aegean,
     ink is bone. --accent is the brand blue lightened until it is legible on a dark
     ground: it is aegean, not a third hue. --gold is the brand accent and is spent
     on exactly ONE thing in this UI — the wordmark dot. Semantic ok/warn/bad are a
     separate set on purpose; a status colour is not a brand colour. */
  :root{ --bg:#0b1a2b; --panel:#12253a; --panel2:#17304a; --line:#24384f; --fg:#f2ede1;
         --muted:#93a4b8; --accent:#6fa0d1; --accent2:#245e96; --accent3:#2b6ba8;
         --gold:#c9a227; --ok:#8fae52; --bad:#e0725f; --warn:#d9a441; }
  /* issue #42: an author `display` rule beats the browser's own
     [hidden]{display:none}, so anything hidden with the attribute AND given a
     display by a class showed anyway — which is exactly what happened to the
     inactivity bar, and then again in a downstream page that copied the pattern.
     One rule, once, rather than a `.thing[hidden]` for every future thing. */
  [hidden]{display:none !important}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif)}
  a{color:var(--accent)} button{font:inherit;cursor:pointer}
  .btn{background:var(--accent2);color:var(--btn-ink,#fff);border:0;border-radius:var(--radius,8px);padding:9px 14px;font-weight:600}
  .btn:hover{background:var(--accent3)} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:6px} .btn.bad{background:#3a2222;border:1px solid #5e332c;color:#f2b8ab}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
         border-radius:8px;padding:9px 11px;font:inherit;margin:4px 0 10px}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap} .row>*{flex:1;min-width:0}
  .muted{color:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .badge.ok{color:var(--ok);border-color:#3a4a24} .badge.op{color:var(--warn);border-color:#4a3a20}
  .badge.bad{color:var(--bad);border-color:#5e332c} .badge.run{color:var(--accent);border-color:#2c4a6b}
  /* workflow step tree: a map fan-out's children are indented under their parent row */
  tr.wfkid td:first-child{padding-left:26px;position:relative}
  tr.wfkid td:first-child::before{content:'└';position:absolute;left:10px;color:var(--muted)}
  pre.wfjson{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;
    margin:6px 0 0;overflow:auto;max-height:260px;font-size:12px;white-space:pre-wrap;word-break:break-word}
  /* auth */
  .auth{max-width:420px;margin:8vh auto;padding:0 16px}
  .brand{font-weight:800;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:.42em}
  .brand .dot{color:var(--gold)}
  /* Brand rule: the mark is aegean, or a knockout. The console ground is dark, so
     it is a knockout — it inherits the wordmark's colour rather than borrowing the
     UI accent, which would put a third blue on the page. */
  .tmx-mark{display:block;flex:none;color:inherit}
  .tmx-logo{display:block;flex:none;width:auto;max-width:260px;object-fit:contain}
  .auth .brand{justify-content:center;margin-bottom:.1em}
  /* shell */
  header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header.top .sp{flex:1} .chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
  nav.tabs{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
  nav.tabs button{background:transparent;border:0;color:var(--muted);padding:8px 14px;border-radius:8px;font-weight:600}
  nav.tabs button.active{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  main.wrap{padding:18px 20px;max-width:960px}
  .langtog button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px}
  .langtog button.active{color:var(--fg);border-color:var(--accent)}
  .note{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--panel2)}
  .note h4{margin:0 0 4px} table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  .bubble .q{color:var(--muted);font-size:13px} .toast{position:fixed;right:16px;bottom:16px;max-width:340px;padding:12px 14px;border-radius:10px;
         background:#2e1c18;border:1px solid #5e332c;color:#f2c9bf;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:.2s}
  .toast.show{opacity:1;transform:none} .toast.ok{background:#1a2415;border-color:#3a4a24;color:#d3e6ae}
  /* issue #38: the inactivity warning. Fixed to the TOP so it cannot be mistaken
     for a toast, which is transient by convention and this is not. */
  .idlebar{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:60;display:flex;gap:10px;
           align-items:center;padding:10px 14px;border-radius:0 0 10px 10px;background:#2e1c18;
           border:1px solid #5e332c;border-top:none;color:#f2c9bf;box-shadow:0 8px 30px rgba(0,0,0,.4);
           font-size:13px;max-width:92vw}
  h1,h2,h3{letter-spacing:-.01em} h2{margin:.2em 0 .6em}
  /* which build is this: quiet, on every console page, and never on a public one */
  footer.build{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    padding:14px 20px;margin-top:10px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px}
  footer.build a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  footer.build a:hover,footer.build a:focus-visible{color:var(--fg)}
  /* #176: a search field and its button are ONE control. They were a `.row`,
     whose children are flex columns: the left one carried a label and the input,
     the right one a bare button, so `align-items:end` aligned the button to the
     taller column's bottom edge and it hung low beside the field. A composed
     control has no two heights to reconcile. The focus ring moves to the WRAPPER
     (`:focus-within`), or a borderless input inside a bordered box shows nothing
     at all when it has the caret. */
  .searchbar{display:flex;align-items:stretch;background:var(--panel2);
    border:1px solid var(--line);border-radius:var(--radius,10px);overflow:hidden}
  .searchbar:focus-within{border-color:var(--accent)}
  .searchbar input{flex:1;min-width:0;margin:0;border:0;border-radius:0;background:transparent;padding:12px 14px}
  .searchbar input:focus{outline:none}
  .searchbar button{flex:none;border-radius:0;padding:0 20px;font-size:17px;line-height:1}
  /* the results area reserves nothing until it holds something: an empty card
     with a gap under the field is what the report's screenshot was of */
  #sres:not(:empty){margin-top:12px}
  /* ---- Tier-A skinnable beta landing: fully theme-token driven, scoped to .bx ---- */
  .bx{min-height:100vh;background:var(--bx-bg,#0b1a2b);color:var(--bx-ink,#f2ede1);font-family:var(--bx-font,ui-sans-serif,system-ui,sans-serif)}
  .bx-wrap{max-width:940px;margin:0 auto;padding:0 20px}
  .bx-head{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
  .bx-logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--bx-ink);
           display:inline-flex;align-items:center;gap:.45em}
  .bx-logo-img{height:32px;width:auto;max-width:220px;display:block}
  .bx-frame{border:0;width:100%;height:100vh;display:block}
  .bx-nav{display:flex;gap:18px;font-size:14px}
  .bx-nav a{color:var(--bx-muted,#93a4b8);text-decoration:none}
  .bx-lang{display:flex;gap:6px;margin-left:18px}
  .bx-lang button{background:none;border:1px solid var(--bx-muted,#93a4b8);color:var(--bx-muted,#93a4b8);
    border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;line-height:1.6}
  .bx-lang button.active{background:var(--bx-brand,#c9a227);border-color:var(--bx-brand,#c9a227);
    color:var(--bx-brandInk,#132c46);font-weight:600}
  .bx-lang button:focus-visible{outline:2px solid var(--bx-brand,#c9a227);outline-offset:2px}
  .bx-hero{background:var(--bx-hero,transparent);border-radius:calc(var(--bx-radius,10px) + 4px);padding:42px 30px;margin:6px 0 26px}
  .bx-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bx-brand,#c9a227);font-weight:700;margin-bottom:10px}
  .bx-hero h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.08;margin:0 0 10px;color:var(--bx-ink);font-family:var(--bx-fontd,inherit)}
  .bx-hero p{font-size:1.04rem;color:var(--bx-muted);max-width:52ch;margin:0}
  .bx-main{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:start;padding-bottom:36px}
  @media(max-width:760px){.bx-main{grid-template-columns:1fr}}
  .bx-card{background:var(--bx-surface,#12253a);border:1px solid var(--bx-line,rgba(255,255,255,.10));border-radius:var(--bx-radius,10px);padding:22px}
  .bx-card label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--bx-muted);margin:0 0 4px}
  .bx-card input,.bx-card select,.bx-card textarea{width:100%;background:var(--bx-bg);border:1px solid var(--bx-line,rgba(255,255,255,.14));color:var(--bx-ink);border-radius:calc(var(--bx-radius,10px) - 2px);padding:9px 11px;font:inherit;margin:0 0 12px}
  .bx-cta{width:100%;background:var(--bx-brand,#c9a227);color:var(--bx-brandink,#132c46);border:0;border-radius:calc(var(--bx-radius,10px) - 2px);padding:12px;font-weight:800;font-size:15px;cursor:pointer}
  .bx-cta[disabled]{opacity:.8;cursor:default}
  .bx-details h3{font-size:1.05rem;margin:0 0 4px;color:var(--bx-ink)}
  .bx-details p{color:var(--bx-muted);margin:0 0 16px;font-size:.95rem;white-space:pre-line}
  .bx-foot{border-top:1px solid var(--bx-line,rgba(255,255,255,.08));padding:18px 0;color:var(--bx-muted);font-size:13px;text-align:center;white-space:pre-line}
  /* NOT --bx-brand: brand exists to make the CTA pop and an author may legitimately set it to
     anything (incl. a value that vanishes against bg). ink/muted are the tokens an author must
     keep legible on bg, so the way in can't be themed into invisibility. Underlined so it reads
     as a link without depending on hue at all. */
  .bx-signin a{color:var(--bx-muted);text-decoration:underline;text-underline-offset:2px}
  .bx-signin a:hover,.bx-signin a:focus-visible{color:var(--bx-ink)}
  /* editor */
  .bx-warn{border:1px solid #b45309;background:rgba(180,83,9,.12);border-radius:8px;padding:9px 11px;margin:10px 0 0;font-size:13px}
  .bx-warn b{font-weight:700}
  .bx-ed{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.bx-ed{grid-template-columns:1fr}}
  .bx-ed .fieldrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .bx-ed .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:700}
  .bx-swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bx-swatches input[type=color]{height:34px;padding:2px}
  /* Signing in is two rounds of API calls, so on a real box the sign-in card
     still sits there for a beat and then the shell replaces it. The swap used to
     be a hard cut; a short fade makes it a transition. Somebody who asked their
     OS for less motion gets none. */
  @keyframes tmx-fade-in{from{opacity:0}to{opacity:1}}
  .tmx-enter{animation:tmx-fade-in .15s ease-out both}
  @media (prefers-reduced-motion: reduce){ .tmx-enter{animation:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="idlebar" class="idlebar" hidden><span id="idlemsg"></span><button class="btn sm" id="idlestay" type="button"></button></div>
<script src="/console/01-base.js"></script>
<script src="/console/02-auth.js"></script>
<script src="/console/03-tabs.js"></script>
<script src="/console/04-localize.js"></script>
<script src="/console/05-fleet.js"></script>
<script src="/console/06-admin.js"></script>
<script src="/console/07-render.js"></script>
<script src="/console/08-reviews.js"></script>
<script src="/console/09-repo.js"></script>
<script src="/console/10-flow.js"></script>
<script src="/console/11-beta.js"></script>
<script src="/console/12-theme.js"></script>
<script src="/console/13-kg.js"></script>
</body>
</html>

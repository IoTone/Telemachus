<!doctype html>
<meta charset="utf-8">
<title>Word count</title>
<!-- The worked example for an AUTHENTICATED plugin bundle (issue #20). The
     platform serves this directory at /api/x/example-tools/bundle/ to a caller
     with a bearer token, with `Cache-Control: private, no-store`, so a plugin's
     customer screens never sit behind a public cached path.

     0.13.0: this page is served under the STRICT bundle policy
     (`script-src 'self'` and no inline script), which is what every plugin gets
     unless its manifest declares `"csp": "relaxed"`. So the code below is
     `app.js` beside this file, not a `<script>` block, and assets must ship in the
     bundle: no CDN script, style or font is reachable. -->
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 34rem; }
  input, button { font: inherit; padding: .4rem .6rem; }
  output { display: block; margin-top: 1rem; font-weight: 600; }
</style>
<h1>Word count</h1>
<p>A plugin screen calling its own API route.</p>
<p><input id="t" size="40" placeholder="Type something"> <button id="go">Count</button></p>
<output id="out"></output>
<script src="./app.js"></script>

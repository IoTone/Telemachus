<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Hybrid deployment</title><desc id="d">The TMach server sends sensitive work to local models and sends other work to a cloud model only when the per-label rules allow it. Every model call is logged.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8794"/></marker></defs>
<rect width="900" height="440" rx="12" fill="#ffffff" stroke="#d9dee3"/>
<text x="450" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2933">Hybrid: local models for sensitive work, a cloud model for the rest</text><rect x="20" y="60" width="590" height="330" rx="14" fill="none" stroke="#2f855a" stroke-width="1.5" stroke-dasharray="7 5"/><text x="34" y="82" font-size="13" font-weight="600" fill="#2f855a">Your private network</text><rect x="40" y="105" width="235" height="65" rx="10" fill="#e6f0ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="157.5" y="127.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">TMach server</text><text x="157.5" y="145.0" text-anchor="middle" font-size="12.5" fill="#52606d">documents stay here</text><rect x="40" y="190" width="235" height="150" rx="10" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="157.5" y="229.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Your rules, per document label</text><text x="157.5" y="247.0" text-anchor="middle" font-size="12.5" fill="#52606d">confidential: local only</text><text x="157.5" y="264.0" text-anchor="middle" font-size="12.5" fill="#52606d">internal: cloud if names</text><text x="157.5" y="281.0" text-anchor="middle" font-size="12.5" fill="#52606d">and IDs are removed</text><text x="157.5" y="298.0" text-anchor="middle" font-size="12.5" fill="#52606d">public: either</text><rect x="385" y="105" width="205" height="75" rx="10" fill="#e3f6ea" stroke="#2f855a" stroke-width="1.5"/><text x="487.5" y="132.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Local model or workers</text><text x="487.5" y="150.0" text-anchor="middle" font-size="12.5" fill="#52606d">on your own hardware</text><rect x="385" y="265" width="205" height="75" rx="10" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/><text x="487.5" y="283.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Request log</text><text x="487.5" y="301.5" text-anchor="middle" font-size="12.5" fill="#52606d">every model call, the host</text><text x="487.5" y="318.5" text-anchor="middle" font-size="12.5" fill="#52606d">it went to, no prompt text</text><rect x="670" y="150" width="205" height="90" rx="10" fill="#fde8e8" stroke="#c53030" stroke-width="1.5"/><text x="772.5" y="176.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Cloud model</text><text x="772.5" y="194.0" text-anchor="middle" font-size="12.5" fill="#52606d">any OpenAI-compatible</text><text x="772.5" y="211.0" text-anchor="middle" font-size="12.5" fill="#52606d">endpoint</text><line x1="275" y1="138" x2="383" y2="140" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><text x="330" y="128" text-anchor="middle" font-size="12" fill="#52606d">sensitive work</text><line x1="275" y1="235" x2="668" y2="200" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><text x="470" y="238" text-anchor="middle" font-size="12" fill="#52606d">only what the rules allow</text><line x1="275" y1="300" x2="383" y2="302" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><text x="450" y="418" text-anchor="middle" font-size="13" font-weight="400" fill="#52606d">A request that breaks a rule is refused before anything is sent, and the refusal is recorded.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" width="900" height="455" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Deployment with GPU workers</title><desc id="d">GPU machines run a worker and a model server. Workers connect to the TMach server over a private network and pull jobs from its queue.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8794"/></marker></defs>
<rect width="900" height="455" rx="12" fill="#ffffff" stroke="#d9dee3"/>
<text x="450" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2933">Workers: add GPU machines to share the load</text><rect x="215" y="60" width="665" height="345" rx="14" fill="none" stroke="#2f855a" stroke-width="1.5" stroke-dasharray="7 5"/><text x="229" y="82" font-size="13" font-weight="600" fill="#2f855a">Your private network (LAN or tailnet)</text><rect x="20" y="180" width="160" height="80" rx="10" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/><text x="100.0" y="201.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Your team</text><text x="100.0" y="219.0" text-anchor="middle" font-size="12.5" fill="#52606d">anywhere on the</text><text x="100.0" y="236.0" text-anchor="middle" font-size="12.5" fill="#52606d">private network</text><rect x="245" y="150" width="230" height="70" rx="10" fill="#e6f0ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="360.0" y="174.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">TMach server</text><text x="360.0" y="192.5" text-anchor="middle" font-size="12.5" fill="#52606d">console, API, permissions</text><rect x="245" y="230" width="230" height="60" rx="10" fill="#fff4d6" stroke="#b7791f" stroke-width="1.5"/><text x="360.0" y="249.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Job queue</text><text x="360.0" y="267.5" text-anchor="middle" font-size="12.5" fill="#52606d">budgets and limits per team</text><rect x="245" y="300" width="230" height="60" rx="10" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/><text x="360.0" y="335.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Database and documents</text><rect x="630" y="95" width="225" height="75" rx="10" fill="#e3f6ea" stroke="#2f855a" stroke-width="1.5"/><text x="742.5" y="122.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">GPU machine, office</text><text x="742.5" y="140.0" text-anchor="middle" font-size="12.5" fill="#52606d">worker + model server</text><line x1="628" y1="133" x2="477" y2="260" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><rect x="630" y="205" width="225" height="75" rx="10" fill="#e3f6ea" stroke="#2f855a" stroke-width="1.5"/><text x="742.5" y="232.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">GPU machine, rack</text><text x="742.5" y="250.0" text-anchor="middle" font-size="12.5" fill="#52606d">worker + model server</text><line x1="628" y1="243" x2="477" y2="260" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><rect x="630" y="315" width="225" height="75" rx="10" fill="#e3f6ea" stroke="#2f855a" stroke-width="1.5"/><text x="742.5" y="342.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Workstation, after hours</text><text x="742.5" y="360.0" text-anchor="middle" font-size="12.5" fill="#52606d">worker + model server</text><line x1="628" y1="353" x2="477" y2="260" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><line x1="180" y1="205" x2="243" y2="190" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><text x="540" y="98" text-anchor="middle" font-size="12" font-weight="400" fill="#52606d">workers connect out</text><text x="540" y="113" text-anchor="middle" font-size="12" font-weight="400" fill="#52606d">and pull jobs from the queue</text><text x="450" y="432" text-anchor="middle" font-size="13" font-weight="400" fill="#52606d">Each worker runs one job at a time. GPU machines need no open ports. Add a machine and the team gets more capacity.</text>
</svg>

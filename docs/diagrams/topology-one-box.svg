<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 325" width="800" height="325" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">One-box deployment</title><desc id="d">A team connects to one server that runs TMach, its database, and a local model server. Nothing leaves the machine.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8794"/></marker></defs>
<rect width="800" height="325" rx="12" fill="#ffffff" stroke="#d9dee3"/>
<text x="400" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2933">One box: everything on a single server</text><rect x="30" y="120" width="170" height="80" rx="10" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/><text x="115.0" y="141.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Your team</text><text x="115.0" y="159.0" text-anchor="middle" font-size="12.5" fill="#52606d">browsers, scripts,</text><text x="115.0" y="176.0" text-anchor="middle" font-size="12.5" fill="#52606d">S3 clients</text><rect x="260" y="70" width="510" height="200" rx="14" fill="none" stroke="#2f855a" stroke-width="1.5" stroke-dasharray="7 5"/><text x="274" y="92" font-size="13" font-weight="600" fill="#2f855a">One server you own</text><rect x="285" y="110" width="210" height="60" rx="10" fill="#e6f0ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="390.0" y="129.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">TMach server</text><text x="390.0" y="147.5" text-anchor="middle" font-size="12.5" fill="#52606d">console, API, job queue</text><rect x="285" y="190" width="210" height="60" rx="10" fill="#f1f3f5" stroke="#7b8794" stroke-width="1.5"/><text x="390.0" y="209.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Database and documents</text><text x="390.0" y="227.5" text-anchor="middle" font-size="12.5" fill="#52606d">SQLite or PostgreSQL</text><rect x="545" y="140" width="200" height="80" rx="10" fill="#e3f6ea" stroke="#2f855a" stroke-width="1.5"/><text x="645.0" y="161.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Model server</text><text x="645.0" y="179.0" text-anchor="middle" font-size="12.5" fill="#52606d">Ollama or llama-server</text><text x="645.0" y="196.0" text-anchor="middle" font-size="12.5" fill="#52606d">on the same machine</text><line x1="200" y1="150" x2="283" y2="142" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><line x1="495" y1="145" x2="543" y2="165" stroke="#7b8794" stroke-width="1.8" marker-end="url(#a)"/><text x="400" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#52606d">Nothing leaves this machine. Works with no internet connection.</text>
</svg>

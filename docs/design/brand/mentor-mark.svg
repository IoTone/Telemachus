<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="tm-t">
  <title id="tm-t">Telemachus</title>
  <!-- Athena came to Telemachus disguised as Mentor: an intelligence wearing a
       familiar form. A Corinthian helm's face opening is already a T — so the void
       does all three jobs at once. Helm, owl, letter. One shape.
       Canonical geometry. Do not re-proportion; use the size-specific files below. -->
  <path d="M16 55 V29 a16 16 0 0 1 32 0 V55 Z
           M22 30 h20 a5.5 5.5 0 0 1 0 11 h-20 a5.5 5.5 0 0 1 0 -11 Z
           M29.3 30 h5.4 v18 a2.7 2.7 0 0 1 -5.4 0 Z" fill="#132c46" fill-rule="evenodd"/>
</svg>
